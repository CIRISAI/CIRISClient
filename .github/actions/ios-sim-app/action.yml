name: Build the iOS simulator app
description: >
  Materialize the iOS substrate the way CIRISAgent's gate does, build the
  simulator app against it, free the ports its embedded runtime binds, and boot
  an iPhone simulator. One bring-up for both iOS legs of five-platform-live-qa
  (node-only `macos-ios`, with-AI `ios-ai`).

# WHY AN ACTION. The recipe below took a dozen red runs to get right (each of
# its comments is one of them). The with-AI iOS leg (CIRISClient#50) needs the
# same app, and a second copy of 250 lines of substrate is a second thing to
# keep right; a fix to one that missed the other would read as an iOS defect.
#
# WHAT THE APP EMBEDS IS THE AGENT. ContentView.swift starts the bundle's
# Python runtime (`ciris_ios.kmp_main`, CIRISAgent's engine) before Compose
# shows; Main.ios.kt points the client at it, `apiBaseUrl = 127.0.0.1:8080`.
# "Run without AI" stops that brain and the node on :4243 serves alone
# (PythonRuntime.ios.kt, CIRISAgent#1149); "with AI" configures it. So the
# with-AI leg needs no host agent — it needs this app built from the run's
# agent tag (`agent-ref`).

inputs:
  agent-ref:
    description: "CIRISAgent ref whose iOS bundle and engine the app embeds; empty = its default branch"
    required: false
    default: ""
  run-server-version:
    description: "the run's ciris-server version, for the notice that the embedded node is not it"
    required: false
    default: ""

outputs:
  app:
    description: "path to the built iosApp.app"
    value: ${{ steps.build.outputs.app }}
  embedded:
    description: "the ciris-server the app embeds (the agent's requirements.txt pin)"
    value: ${{ steps.agent.outputs.embedded }}
  udid:
    description: "the booted simulator (also exported as IOS_UDID)"
    value: ${{ steps.sim.outputs.udid }}

runs:
  using: composite
  steps:
      # ── THE iOS BUNDLE, MATERIALIZED THE WAY THE AGENT'S GATE DOES IT ──────
      #
      # The app shows its Compose view — and the test server inside it — only
      # after the EMBEDDED Python runtime reports healthy (ContentView.swift:
      # extractResources → initializePython → startRuntime → checkHealth). So
      # the simulator needs the whole substrate, not just a project that
      # compiles:
      #
      #   1. Resources.zip — the stdlib + engine + app packages. The copy this
      #      tree vendors (CIRISClient#24) is a 77-file stub with no python/lib
      #      and no ciris_engine; the agent's tracked apps/ios/Resources.zip is
      #      the real 5,958-file bundle. Take theirs, refreshed to their pin by
      #      their own tool, so the PyO3 slices and the pure-Python packages
      #      are one consistent set.
      #   2. Python.xcframework — beeware/Python-Apple-support 3.10-b14, which
      #      briefcase would download for the same build. Its simulator slice
      #      keeps lib-dynload under lib-arm64/ and lib-x86_64/ rather than
      #      lib/; the re-vendored embed_native_frameworks.sh reads that layout.
      #      The old note that adopting it "is a port, not a download" predates
      #      that script change and was wrong by the time it was written down.
      #   3. The simulator natives — ciris_server's PyO3 slice (laid down by
      #      update_substrate_libs from the CIRISServer release), cffi /
      #      aiohttp / cryptography (BeeWare's prebuilt simulator wheels), and
      #      pydantic_core, which publishes no iOS wheel anywhere and is
      #      cross-built with cargo against the slice. This is the agent's
      #      refresh-ios-substrate.yml `build_sim_natives` recipe, carried here
      #      because that reusable workflow checks out the CALLER's repository
      #      and so cannot be `uses:`d from this one.
      #
      # Every step asserts what it produced, because a missing piece does not
      # fail xcodebuild — it produces an app that installs and launches to a
      # spinner, which is the failure mode this gate exists to stop.
      - name: Check out the agent, whose iOS bundle this app embeds
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          # Empty: the agent's default branch (the node-only leg). The with-AI
          # leg passes the run's ONE agent tag, so the engine the app embeds is
          # the agent the `server` job resolved.
          ref: ${{ inputs.agent-ref }}
          path: .agent

      - name: Refresh the agent's iOS substrate to its pin, then take the bundle
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          PY_TAG: "3.10-b14"
          PY_ASSET: "Python-3.10-iOS-support.b14.tar.gz"
        shell: bash
        run: |
          set -euo pipefail
          IOS=client/iosApp
          S=$(grep -oE "^ciris-server[>=<!~ ]*[0-9]+\.[0-9]+\.[0-9]+" .agent/requirements.txt | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          [ -n "$S" ] || { echo "::error::no ciris-server pin in .agent/requirements.txt"; exit 1; }
          # THE iOS APP EMBEDS THIS NODE, NOT THE RUN'S. The simulator client
          # talks to the ciris-server inside its own bundle, which is whatever
          # CIRISAgent's requirements.txt pins; the run's server version
          # (`server` job) is the peer this leg stands up and the binary it
          # downloaded. Both go on the board; neither is claimed for the other.
          echo "embedded=$S" >> "$GITHUB_OUTPUT"
          echo "::notice::iOS embeds the Agent's pinned ciris-server $S; the run's server version is ${{ inputs.run-server-version }} (its two-node peer)"
          echo "agent pins ciris-server $S"
          ( cd .agent && python3 tools/update_substrate_libs.py --platform ios --lib server "$S" )

          for p in Resources.zip app_packages_native substrate.lock.json; do
            rm -rf "$IOS/$p"; cp -R ".agent/apps/ios/$p" "$IOS/$p"
          done
          rm -rf "$IOS/app_packages_native_sim"
          [ -d .agent/apps/ios/app_packages_native_sim ] && cp -R .agent/apps/ios/app_packages_native_sim "$IOS/" || true
          rm -rf "$IOS/Frameworks/CIRISVerify.xcframework"
          cp -R .agent/apps/ios/Frameworks/CIRISVerify.xcframework "$IOS/Frameworks/"
          unzip -l "$IOS/Resources.zip" | grep -q " python/lib/python3.10/" \
            || { echo "::error::the agent's Resources.zip carries no python/lib — not the bundle this expects"; exit 1; }
          unzip -l "$IOS/Resources.zip" | grep -q " app/ciris_engine/" \
            || { echo "::error::the agent's Resources.zip carries no ciris_engine"; exit 1; }

          # THE ENGINE IN THE ZIP IS AS OLD AS THE ZIP; THE ENGINE IN THE TREE
          # IS CURRENT. The tracked Resources.zip is rebuilt by hand, and its
          # app/ciris_ios/kmp_main.py had already moved ahead of the
          # app/ciris_engine beside it: `from ciris_engine import node_only`
          # against a ciris_engine with no node_only.py — the engine died on
          # its first import and the app reported "Engine Failed to Start"
          # (run 35363746850, python_error.log). The agent's own gate never
          # sees this because rebuild_and_deploy.sh --quick overlays
          # ciris_engine + ciris_adapters from the checkout and re-zips before
          # every build. Same overlay, same excludes, here.
          echo "Resources.zip (as tracked): $(unzip -l "$IOS/Resources.zip" | tail -1)"
          rm -rf "$RUNNER_TEMP/res" && mkdir -p "$RUNNER_TEMP/res"
          (cd "$RUNNER_TEMP/res" && unzip -qo "$GITHUB_WORKSPACE/$IOS/Resources.zip")
          EXCL=(--exclude='__pycache__' --exclude='.pytest_cache' --exclude='*.pyc' --exclude='*.pyo'
                --exclude='gui_static' --exclude='desktop_app' --exclude='android_gui_static'
                --exclude='README*' --exclude='*.md' --exclude='examples/' --exclude='tests/' --exclude='adapters/discord')
          rsync -a --delete "${EXCL[@]}" .agent/ciris_engine/   "$RUNNER_TEMP/res/app/ciris_engine/"
          rsync -a --delete "${EXCL[@]}" .agent/ciris_adapters/ "$RUNNER_TEMP/res/app/ciris_adapters/"
          find "$RUNNER_TEMP/res" -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          test -f "$RUNNER_TEMP/res/app/ciris_engine/node_only.py" \
            || { echo "::error::overlaid ciris_engine still has no node_only.py — the agent checkout is not what kmp_main expects"; exit 1; }
          rm -f "$IOS/Resources.zip"
          (cd "$RUNNER_TEMP/res" && zip -q -r "$GITHUB_WORKSPACE/$IOS/Resources.zip" .)
          echo "Resources.zip (engine overlaid from .agent @ $(git -C .agent rev-parse --short HEAD)): $(unzip -l "$IOS/Resources.zip" | tail -1)"

          gh release download "$PY_TAG" --repo beeware/Python-Apple-support -p "$PY_ASSET" -O "$RUNNER_TEMP/pysupport.tar.gz"
          mkdir -p "$RUNNER_TEMP/pysupport" && tar -xzf "$RUNNER_TEMP/pysupport.tar.gz" -C "$RUNNER_TEMP/pysupport"
          XCF=$(find "$RUNNER_TEMP/pysupport" -maxdepth 3 -name "Python.xcframework" -type d | head -1)
          [ -n "$XCF" ] || { echo "::error::$PY_ASSET carried no Python.xcframework"; exit 1; }
          rm -rf "$IOS/Frameworks/Python.xcframework"; cp -R "$XCF" "$IOS/Frameworks/"
          test -d "$IOS/Frameworks/Python.xcframework/ios-arm64_x86_64-simulator/lib-arm64/python3.10/lib-dynload" \
            || { echo "::error::Python.xcframework's simulator slice has no lib-arm64/python3.10/lib-dynload"; exit 1; }
          echo "Python.xcframework: $(du -sh "$IOS/Frameworks/Python.xcframework" | cut -f1)"

      - name: Set up Python 3.10 (build-side interpreter for the cp310 iOS embed)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Materialize the simulator natives
        env:
          GH_TOKEN: ${{ github.token }}
          BEEWARE_INDEX: "https://pypi.anaconda.org/beeware/simple"
          IOS_SIM_TAG: "ios_13_0_arm64_iphonesimulator"
        shell: bash
        run: |
          set -uo pipefail
          IOS=client/iosApp
          OUT="$IOS/app_packages_native_sim"; mkdir -p "$OUT"
          WORK="$RUNNER_TEMP/simnat"; mkdir -p "$WORK/wheels" "$WORK/src" "$WORK/x"
          status=()
          test -f "$OUT/ciris_server/_native.abi3.so" \
            || { echo "::error::no simulator ciris_server at $OUT/ciris_server/_native.abi3.so — update_substrate_libs did not lay it down"; exit 1; }
          status+=("ciris_server=refreshed")

          ver_of() { unzip -l "$IOS/Resources.zip" | awk '{print $4}' | grep -oE "app_packages/$1-[0-9][0-9.]*\.dist-info" | head -1 | sed -E "s/.*$1-([0-9.]+)\.dist-info/\1/"; }
          V_PYDC=$(ver_of pydantic_core); V_CRYPTO=$(ver_of cryptography); V_AIO=$(ver_of aiohttp); V_CFFI=$(ver_of cffi)
          echo "versions:  pydantic_core=$V_PYDC cryptography=$V_CRYPTO aiohttp=$V_AIO cffi=$V_CFFI"
          for v in "$V_PYDC" "$V_CRYPTO" "$V_AIO" "$V_CFFI"; do [ -n "$v" ] || { echo "::error::could not read a bundled version from Resources.zip"; exit 1; }; done

          # --- 1. the three C extensions: BeeWare's prebuilt simulator wheels ---
          fetch_wheel() { # name version
            if python -m pip download -q --no-deps --only-binary :all: --index-url "$BEEWARE_INDEX" \
                 --platform "$IOS_SIM_TAG" --python-version 3.10 --implementation cp --abi cp310 \
                 "$1==$2" -d "$WORK/wheels" 2>&1 | tail -5; then
              status+=("$1=fetched")
            else
              status+=("$1=MISSING-ON-INDEX"); echo "::warning::no cp310 $IOS_SIM_TAG wheel for $1==$2 on $BEEWARE_INDEX"
            fi
          }
          fetch_wheel cffi "$V_CFFI"
          fetch_wheel aiohttp "$V_AIO"
          fetch_wheel cryptography "$V_CRYPTO"

          # --- 2. pydantic_core: cargo, cross-compiled with PyO3 against the slice ---
          SLICE="$IOS/Frameworks/Python.xcframework/ios-arm64_x86_64-simulator"
          rustup target add aarch64-apple-ios-sim >/dev/null 2>&1 || true
          python -m pip install -q typing_extensions   # build.rs runs generate_self_schema.py on the host
          SDIST_URL=$(curl -s "https://pypi.org/pypi/pydantic-core/$V_PYDC/json" | python -c 'import json,sys; print(next(u["url"] for u in json.load(sys.stdin)["urls"] if u["packagetype"]=="sdist"))')
          if [ -n "$SDIST_URL" ] && curl -sSL "$SDIST_URL" -o "$WORK/src/pydantic_core.tar.gz" \
             && tar -xzf "$WORK/src/pydantic_core.tar.gz" -C "$WORK/src" \
             && ( cd "$WORK/src"/pydantic_core-*/ \
                  && SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)" IPHONEOS_DEPLOYMENT_TARGET=13.0 \
                     PYO3_PYTHON="$(command -v python3.10)" \
                     PYO3_CROSS_LIB_DIR="$OLDPWD/$SLICE/lib-arm64" PYO3_CROSS_PYTHON_VERSION=3.10 PYO3_CROSS_PYTHON_IMPLEMENTATION=CPython \
                     CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup" \
                     cargo build --release --target aarch64-apple-ios-sim --features "pyo3/extension-module" 2>&1 | grep -vE "^\s+(Compiling|Downloading|Downloaded|Updating|Locking|Fresh) " | tail -30 \
                  && DYLIB=$(ls target/aarch64-apple-ios-sim/release/lib_pydantic_core.dylib) \
                  && mkdir -p "$OLDPWD/$OUT/pydantic_core" \
                  && cp "$DYLIB" "$OLDPWD/$OUT/pydantic_core/_pydantic_core.cpython-310-iphonesimulator.so" ); then
            status+=("pydantic_core=built")
          else
            status+=("pydantic_core=FAILED"); echo "::warning::simulator native build FAILED: pydantic_core"
          fi

          # --- 3. extract the wheels' .so files into app_packages_native_sim/ ---
          for whl in "$WORK/wheels"/*.whl; do
            [ -f "$whl" ] || continue
            X="$WORK/x/$(basename "$whl" .whl)"; mkdir -p "$X"; unzip -qo "$whl" -d "$X"
            while IFS= read -r so; do
              rel="${so#$X/}"; mkdir -p "$OUT/$(dirname "$rel")"; cp "$so" "$OUT/$rel"
            done < <(find "$X" -name "*.so" -type f)
          done
          echo "## simulator natives" | tee "$OUT/MANIFEST.txt"
          printf '  %s\n' "${status[@]}" | tee -a "$OUT/MANIFEST.txt"
          ok=true
          for want in "ciris_server/_native" "pydantic_core/_pydantic_core" "cryptography/hazmat/bindings/_openssl" "aiohttp/_http_parser" "_cffi_backend"; do
            f=$(find "$OUT" -path "*$want*" -name "*.so" | head -1)
            if [ -n "$f" ]; then
              arch=$(lipo -info "$f" 2>/dev/null | sed 's/.*: //')
              vt=$(xcrun vtool -show-build "$f" 2>/dev/null | awk '/platform/{print $2; exit}')
              case "$vt" in
                IOSSIMULATOR) echo "  ok      $want  [$arch, $vt]" | tee -a "$OUT/MANIFEST.txt" ;;
                "")           echo "  present $want  [$arch, platform unreadable -- kept; the simulator will say]" | tee -a "$OUT/MANIFEST.txt" ;;
                *)            echo "  WRONG-PLATFORM $want  [$arch, $vt]" | tee -a "$OUT/MANIFEST.txt"; ok=false ;;
              esac
            else
              echo "  MISSING $want" | tee -a "$OUT/MANIFEST.txt"; ok=false
            fi
          done
          $ok || { echo "::error::not every simulator native is present and simulator-built — see MANIFEST.txt"; exit 1; }


      - name: Build the simulator app
        id: build
        shell: bash
        run: |
          set -euo pipefail
          # THE TASK NAME, AND THE DIRECTORY, BOTH WRONG — AND THE SECOND HID THE FIRST.
          #
          # `:shared:assembleDebugXCFramework` does not exist. The framework is
          # declared `XCFramework("shared")`, so the tasks are
          # assembleShared{Debug,Release}XCFramework — publish.yml has used the
          # release twin correctly all along and this line never got the same
          # correction. Gradle answered "task is ambiguous" and failed in 2s.
          #
          # Then `cd client && … && cd ..` left the shell IN client/ when the
          # gradle step failed, so xcodebuild resolved client/iosApp/… as
          # client/client/iosApp/… and reported
          # "'client/iosApp/iosApp.xcodeproj' does not exist" — a missing-project
          # error for a problem that was a task name two lines earlier, which is
          # the most expensive kind of wrong message.
          #
          # A subshell cannot leak a directory no matter how the command inside
          # it ends.
          ( cd client && ./gradlew :shared:assembleSharedDebugXCFramework --console=plain )
          # ONE ARCHITECTURE, THE RUNNER'S. `-sdk iphonesimulator` with no
          # destination builds BOTH simulator slices, and the shared framework
          # the link phase picks up is iosSimulatorArm64 alone — so ld ignored
          # every one of its objects "found architecture 'arm64', required
          # architecture 'x86_64'" and the link failed (run 35350176282), after
          # the whole substrate had materialized correctly. The natives are
          # arm64 IOSSIMULATOR too; macos-15 is arm64. Say so.
          # SIGNED, AD HOC, WITH ITS ENTITLEMENTS — Xcode's simulator default,
          # and what the agent's rebuild_and_deploy.sh gets by passing no
          # signing flag at all. `CODE_SIGNING_ALLOWED=NO` was here from the
          # days when the project could not build at all; with the bundle
          # complete it became the actual failure: an unentitled binary gets
          # OSStatus -34018 on every keychain op, ciris_keyring falls back to
          # software per open, and its tier-mismatch rule then SUPERSEDED the
          # node key it had minted seconds earlier — the identity dir showed
          # `ciris-node-bootstrap.ed25519.seed.blob.superseded-pre-v8` and
          # edge found nothing to open (run 35372833410, ciris-server.log).
          # The agent's log on the same runner image says the other half:
          # "hardware_backed: true - ENABLED (ECIES via Secure Enclave)".
          xcodebuild -project client/iosApp/iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath dd build
          app=$(find dd -name 'iosApp.app' -maxdepth 6 | head -1)
          test -n "$app" || { echo "::error::no iosApp.app was produced"; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Free the ports the embedded runtime binds
        shell: bash
        run: |
          set -euo pipefail
          # THE HOST NODE HAS TO BE GONE FIRST. The iOS app embeds its own
          # node, which binds 0.0.0.0:4242 (Reticulum) and :4243 (read API) on
          # the loopback the simulator SHARES with the runner — and the node
          # this job started for the macOS desktop leg was still holding both:
          # "Edge transport ports are held by another process ... Address
          # already in use (os error 48)" (run 35376950849, the first in which
          # the engine got past its identity). The agent's gate frees 4242 4243
          # 8080 9091 between every leg for the same reason. Kill by listener,
          # not by name: what matters is that nothing answers on those ports.
          for port in 4242 4243 8080; do
            pids=$(lsof -ti "tcp:$port" -sTCP:LISTEN 2>/dev/null || true)
            [ -n "$pids" ] && { echo "freeing :$port (pids: $(echo $pids | tr '\n' ' '))"; kill $pids 2>/dev/null || true; }
          done
          sleep 2
          for port in 4242 4243 8080; do
            pids=$(lsof -ti "tcp:$port" -sTCP:LISTEN 2>/dev/null || true)
            [ -n "$pids" ] && { echo "still held :$port — SIGKILL"; kill -9 $pids 2>/dev/null || true; }
          done
          for port in 4242 4243 8080; do
            lsof -ti "tcp:$port" -sTCP:LISTEN >/dev/null 2>&1 && { echo "::error:::$port is still held; the embedded node cannot bind"; exit 1; } || echo ":$port free"
          done

      - name: Boot an iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          # A SIMULATOR HAS TO BE BOOTED BY SOMEONE. The bring-up plan's
          # `simctl boot booted` is a no-op by construction and its
          # `bootstatus booted -b` needs a device that is already up; nothing
          # here started one, so the leg could never have got past install.
          # The newest iOS runtime's newest numbered iPhone — the agent's gate
          # drives an iPhone 16 class device; a list-order pick landed on an
          # iPhone SE (3rd generation).
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          def key(rt): return [int(x) for x in re.findall(r"\d+", rt)]
          best = None
          for rt in sorted((r for r in d if "iOS" in r), key=key, reverse=True):
              ph = [x for x in d[rt] if x.get("isAvailable") and re.match(r"iPhone \d+", x["name"]) and "Pro" not in x["name"] and "Plus" not in x["name"]]
              if ph:
                  best = sorted(ph, key=lambda x: key(x["name"]))[-1]; break
          print(best["udid"] if best else "")')
          test -n "$UDID" || { echo "::error::no available iPhone simulator on this runner"; xcrun simctl list devices available; exit 1; }
          echo "simulator: $UDID"
          echo "IOS_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
