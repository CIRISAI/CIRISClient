name: build

# One client, built once, in two flavors, packaged as wheels.
#
#   checks   — localization parity + vendoring drift. Seconds, no toolchain.
#   gradle   — :shared and the desktop uber-jar, per flavor. JDK 17 + Android SDK.
#   wheels   — stages what gradle produced and builds the three distributions.
#
# All three are REQUIRED. `gradle` shipped advisory (continue-on-error) for
# exactly one run — the question was whether a tree vendored out of a much larger
# build stands alone, and run 32414315040 answered it: both flavors compiled,
# both passed :shared:desktopTest, both produced a 66.48 MiB uber-jar, and both
# were packaged and resolved through the consumption API. So the flag came off in
# the same PR. A job allowed to fail forever is not a check.
#
# `wheels` still tolerates a missing gradle artifact, by staging a PLACEHOLDER
# payload that raises on every artifact lookup and says why. That path is no
# longer the expected one; it is what keeps a broken build from quietly shipping
# a wheel that installs and contains no client.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Seconds, no toolchain, and they fail for reasons you can act on ─────────
  checks:
    name: localization + vendoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The CIRISServer commit this tree was merged against
        id: pair
        # NOT `v$(cat VERSION)`. That pin assumed the client's version trails the
        # server's releases, and the client LEADS by design: 0.5.189 exists here
        # so CIRISServer 0.5.189 can pin a client that has the feature. The tag
        # did not exist, and every workflow failed at checkout.
        #
        # VENDORING.md §1 already records the commit the tree was actually merged
        # against, which is the emitter set the bundle was reconciled with — and
        # it cannot fail to exist, because merging it is what wrote the row.
        run: echo "ref=$(python3 packaging/check_vendoring.py --merged-ref CIRISServer)" >> "$GITHUB_OUTPUT"

      - name: Emitter sources (the ids the bundles must define)
        # The localization bundles live here; the Rust that EMITS ids into them
        # lives in CIRISServer. Five of the twelve checks compare the two, so
        # the guard is handed a checkout instead of being allowed to declare
        # the absence — a check with a denominator of zero is not a pass.
        #
        # Pinned to the merged state in VENDORING.md §1, so the emitters graded
        # are the ones this tree was reconciled against rather than whatever main
        # holds — and the pin moves only when a §8 pull moves it.
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISServer
          ref: ${{ steps.pair.outputs.ref }}
          path: .emitters

      - name: Localization guard (strict)
        # The adopted CIRISServer guard: byte-identity across the four bundles,
        # runtime resolveKey semantics, placeholder parity, reference coverage —
        # and its own mutation self-test runs first, so the gate proves it can
        # fail before it is trusted to pass. --server-src points it at the Rust
        # emitters, which live in CIRISServer. --strict blocks on untranslated
        # keys: 29 languages are 29 audiences and a fallback to English is a
        # silent demotion of one of them.
        run: |
          python3 client/tools/check_localization_sync.py --self-test --server-src .emitters
          python3 client/tools/check_localization_sync.py --server-src .emitters --strict

      - name: Vendoring state
        # client/ is the tree of record. The tracked tree must match the state
        # digest VENDORING.md §1 records (re-recorded by any commit that touches
        # client/), and no never-vendor class — substrate binaries, key material,
        # compiled Python — may be tracked. No clone, no network.
        run: python3 packaging/check_vendoring.py

      - name: Compatibility matrix
        # One row per release, append-only; exactly one row must match VERSION.
        # A release without its matrix row does not merge (FSD §6).
        run: python3 compat/validate.py

      - name: A published version must offer a universal wheel
        # Only for versions already on the index — a PR's VERSION is normally
        # unpublished, and asserting it would fail every PR. What this catches is
        # a release that shipped OS wheels only, which is unresolvable on Android
        # and iOS (CIRISServer#493).
        #
        # THE VERSION IS READ FROM THE SURFACE IT WILL BE ASSERTED AGAINST.
        #
        # This used to take the newest version from `/pypi/ciris-client/json`
        # and then assert it against the SIMPLE INDEX — two independently cached
        # surfaces, so a freshly published version could be visible in one and
        # not the other. That is not a rare race: it failed on 0.5.191 minutes
        # after publishing, with `[PENDING] ciris-client 0.5.191 has no files on
        # the simple index yet` — for a release whose five wheels were live.
        # Retrying would only wait out a gap that need not exist. Reading the
        # version from the simple index makes it impossible by construction: a
        # version this sees is a version that view can answer for.
        run: |
          set -euo pipefail
          prev=$(python3 - <<'EOF'
          import json, urllib.request
          req = urllib.request.Request(
              "https://pypi.org/simple/ciris-client/",
              headers={"Accept": "application/vnd.pypi.simple.v1+json"},
          )
          d = json.loads(urllib.request.urlopen(req, timeout=20).read())
          vs = set()
          for f in d.get("files", []):
              parts = f["filename"].split("-")
              if len(parts) > 1 and parts[0] == "ciris_client":
                  vs.add(parts[1])
          ok = sorted(vs, key=lambda v: [int(x) for x in v.split(".") if x.isdigit()])
          print(ok[-1] if ok else "")
          EOF
          )
          [ -n "$prev" ] && python3 packaging/check_universal_wheel.py "$prev"

      - name: Companion version pin
        # check_pins.py says CI enforces it; until now nothing did. A routine
        # VERSION bump could publish ciris-client==X while the `web` extra still
        # required an older ciris-client-wasm, so `pip install ciris-client[web]`
        # resolved a version split that only showed up at runtime. It caught
        # exactly that on the 0.5.188 bump.
        run: python3 packaging/check_pins.py

      - name: Every interactive control must be drivable in test mode
        # Downstream builds fully automated UI QA against this client, which only
        # works if what automation can SEE it can also DRIVE. A testTag proves
        # visibility and nothing more: a `btn_*` on plain `testable()` makes
        # /click fall back to a Robot click at fixed coordinates, which is luck
        # about DPI and platform scaling — it worked on Linux and Windows and
        # missed on macOS five times running, invisibly (CIRISClient#28).
        #
        # Baselined at the current 203 rather than failing on all of them: a
        # check that breaks the build on day one gets switched off in a week and
        # then protects nothing. This fails on NEW offenders; the baseline is
        # debt with a number that can visibly fall.
        run: python3 client/tools/check_ui_drivable.py


  # ── The client itself. ONE build ────────────────────────────────────────────
  gradle:
    name: gradle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: apt (hardened)
        uses: ./.github/actions/apt
        with:
          # The Compose desktop distribution tasks shell out to these; installing
          # them through the hardened path is the point, not the package list.
          packages: zip unzip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # shared/ pins JvmTarget.JVM_17 on every target

      - uses: android-actions/setup-android@v3
        # :shared applies com.android.library, so the Android SDK is needed to
        # CONFIGURE the build even when only the desktop target is compiled.

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Show the version this build actually stamped
        working-directory: client
        # Print it rather than trust it. This used to assert the generated
        # HAS_AGENT matched the flavor CI asked for, because a flavor that
        # silently defaulted was a wrong artifact with a right-looking name.
        # CIRISServer#479 deleted the flavor, and the same hazard moved to the
        # only value the task still generates: a version that silently defaulted
        # would put a wrong number in the VERSION-MISMATCH banner every user
        # sees. So the assertion moved with it.
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :shared:generateBuildFlavor
          gen=shared/build/generated/flavor/commonMain/kotlin/ai/ciris/mobile/shared/models/ClientVersion.kt
          echo "── generated ClientVersion.kt ──"
          cat "$gen"
          want=$(cat ../VERSION)
          grep -q "CLIENT_VERSION: String = \"$want\"" "$gen" \
            || { echo "::error::generated CLIENT_VERSION is not $want"; exit 1; }
          # And nothing else may appear there. A resurrected compile-time flag
          # would be invisible otherwise, which is how the last one survived.
          test "$(find shared/build/generated/flavor -name '*.kt' | wc -l)" = 1 \
            || { echo "::error::generateBuildFlavor wrote more than ClientVersion.kt"; \
                 find shared/build/generated/flavor -name '*.kt'; exit 1; }

      - name: Compile :shared (desktop target)
        working-directory: client
        run: ./gradlew --no-daemon :shared:compileKotlinDesktop

      - name: Test :shared (desktop target)
        working-directory: client
        run: ./gradlew --no-daemon :shared:desktopTest

      - name: Desktop uber-jar
        working-directory: client
        run: |
          ./gradlew --no-daemon :desktopApp:packageUberJarForCurrentOS
          find desktopApp/build -name '*.jar' -size +1M -printf '%s %p\n' | sort -rn

      - uses: actions/upload-artifact@v4
        with:
          name: gradle-client
          path: client/desktopApp/build/compose/jars/*.jar
          if-no-files-found: warn
          retention-days: 7

  # ── iOS. The only host that can compile the Kotlin or check the Swift ───────
  ios-kotlin:
    name: ios-kotlin
    runs-on: macos-14
    # 70, not 45: the job now also LINKS a debug simulator framework so the
    # Swift can be type-checked against it. Debug linking is minutes, not the
    # ~161 measured for the release XCFramework, but it is not free either.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ON LINUX THIS TASK IS SILENTLY SKIPPED.
      #
      # `./gradlew :shared:compileKotlinIosArm64` on a Linux host prints
      # "Task :shared:compileKotlinIosArm64 SKIPPED" and then BUILD SUCCESSFUL.
      # Every iosMain source file is therefore UNCOMPILED by every ubuntu job in
      # this workflow, and a green build.yml has never once meant the iOS code
      # compiles.
      #
      # That is not hypothetical. 0.5.191 was tagged, released, and shipped with
      # no XCFramework at all because one iosMain file was missing an @OptIn —
      # a one-line error that no CI job was in a position to see until the
      # release job tried to link it, at which point the tag already existed.
      #
      # So this job runs on macOS, and it asserts the task actually EXECUTED
      # rather than trusting the exit code, because a skip and a success are the
      # same green tick.
      - name: Compile iosMain (and prove it was not skipped)
        working-directory: client
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :shared:compileKotlinIosArm64 \
                    :shared:compileKotlinIosSimulatorArm64 | tee /tmp/ios.log
          for t in compileKotlinIosArm64 compileKotlinIosSimulatorArm64; do
            if grep -qE "Task :shared:$t (SKIPPED|NO-SOURCE)" /tmp/ios.log; then
              echo "::error::$t was skipped — this host cannot compile iosMain, so this job proved nothing"
              exit 1
            fi
          done
          test -d shared/build/classes/kotlin/iosArm64/main \
            || { echo "::error::no iosArm64 klib output"; exit 1; }
          echo "iosMain compiled on $(uname -s)"

      # A DEBUG SIMULATOR FRAMEWORK, NOT THE RELEASE XCFRAMEWORK.
      #
      # `assembleSharedReleaseXCFramework` is what publish.yml ships and it is
      # MEASURED at ~161 minutes; nothing that slow can gate a push. The debug
      # simulator framework carries the same Kotlin surface — every symbol the
      # Swift is able to call — and links off the klibs the step above just
      # built. It is not a stand-in either: it is the exact directory the Xcode
      # project points Debug simulator builds at
      # (iosApp/project.yml, FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]).
      - name: Link shared.framework for the simulator (and prove it was not skipped)
        working-directory: client
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 | tee /tmp/ioslink.log
          if grep -qE "Task :shared:linkDebugFrameworkIosSimulatorArm64 (SKIPPED|NO-SOURCE)" /tmp/ioslink.log; then
            echo "::error::linkDebugFrameworkIosSimulatorArm64 was skipped — there is no framework to check the Swift against"
            exit 1
          fi
          fw=shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework
          test -f "$fw/Modules/module.modulemap" \
            || { echo "::error::$fw carries no module.modulemap — 'import shared' could not resolve"; exit 1; }
          echo "linked $fw"

      # THE SWIFT IS TYPE-CHECKED AGAINST THE KOTLIN NOW, NOT MERELY PARSED.
      #
      # `swiftc -parse` stood here and checked syntax alone. The failure this
      # job exists to catch — a Swift call into a Kotlin symbol that does not
      # exist — is invisible to `-parse`, so it still reached a tag unseen
      # (CIRISClient#24). `-typecheck` with -F at the framework linked above
      # resolves every `IosBackendBridge.shared.…` / `AppRestarter.shared.…` /
      # `MainViewControllerWithAuthAndStore(…)` call against the real Kotlin
      # surface, and every source goes in as ONE module so cross-file
      # references resolve the way Xcode resolves them.
      #
      # AND IT PROVES IT CAN FAIL BEFORE IT IS TRUSTED TO PASS. A canary that
      # calls a Kotlin member which has never existed must be REJECTED. If it
      # type-checks, then -F is wrong or the framework is empty, and everything
      # after it would go green having resolved nothing — the same green tick a
      # SKIPPED task gives, which is the trap this whole job was built around.
      #
      # WHAT IT STILL DOES NOT COVER, so the tick is not misread:
      #   * no `xcodebuild` — see the block below for exactly what that takes;
      #   * PythonInit.m is not compiled; it needs <Python/Python.h>;
      #   * `#if targetEnvironment(simulator)` has device arms, and this is the
      #     simulator slice. Kotlin symbols there are unchecked.
      - name: Type-check the Swift against the Kotlin framework
        working-directory: client/iosApp
        run: |
          set -euo pipefail

          fw="$PWD/../shared/build/bin/iosSimulatorArm64/debugFramework"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"

          # THE DEPLOYMENT TARGET IS READ FROM THE SURFACE IT IS CHECKED AGAINST.
          # A hardcoded `ios17.0` stood in the old step while the app ships 15.0,
          # so the check was two majors looser than the build it stands in for
          # and had no way to notice.
          ios=$(python3 - <<'PY'
          import re, sys
          hits = re.findall(r'^\s+iOS:\s*"?([0-9][0-9.]*)"?\s*$', open("project.yml").read(), re.M)
          # Exactly one, or the answer is a guess: a second `iOS:` key would make
          # this silently pick whichever came first.
          if len(hits) != 1:
              sys.exit(f"::error::project.yml has {len(hits)} `iOS:` deployment targets, expected 1: {hits}")
          print(hits[0])
          PY
          )
          target="arm64-apple-ios${ios}-simulator"
          echo "deployment target ${ios} (read from project.yml) -> ${target}"

          # SwiftUI's `#Preview` is a MACRO, and ContentView.swift ends in one.
          # xcodebuild passes the plugin search paths that let the compiler find
          # its implementation; bare `swiftc` does not, so without these the
          # step would fail on a line Xcode compiles happily — a false red is as
          # useless as a false green.
          plugins=""
          server="$(xcrun --find swift-plugin-server 2>/dev/null || true)"
          if [ -n "$server" ]; then
            toolchain_plugins="$(dirname "$(dirname "$server")")/lib/swift/host/plugins"
            if [ -d "$toolchain_plugins" ]; then
              plugins="$plugins -plugin-path $toolchain_plugins"
            fi
            if [ -d "$sdk/usr/lib/swift/host/plugins" ]; then
              plugins="$plugins -external-plugin-path $sdk/usr/lib/swift/host/plugins#$server"
            fi
          fi
          echo "macro plugin search:${plugins:- <none found>}"

          # MATCH THE APP'S LANGUAGE MODE, READ FROM project.yml.
          #
          # Bare swiftc type-checks under the toolchain default, which is
          # stricter than SWIFT_VERSION 5.9 about concurrent capture. On its
          # first real run this step rejected StoreKitManager.swift:144 —
          # "reference to captured var 'self' in concurrently-executing code" —
          # in a file the shipping app compiles without complaint.
          #
          # A gate that reports errors the real build does not have is a gate
          # that gets switched off, and then it protects nothing. So the mode
          # comes from the project, and is asserted present rather than
          # defaulted: a missing SWIFT_VERSION would silently restore the
          # mismatch this comment exists to explain.
          swiftver=$(python3 - <<'PYVER'
          import re, sys, pathlib
          text = pathlib.Path("project.yml").read_text()  # cwd is client/iosApp
          hits = re.findall(r'^\s*SWIFT_VERSION:\s*"?([0-9]+)', text, re.M)
          if len(hits) != 1:
              sys.exit(f"::error::project.yml has {len(hits)} SWIFT_VERSION settings, expected 1: {hits}")
          print(hits[0])
          PYVER
          )
          echo "swift language mode from project.yml: $swiftver"

          # ── The gate must be able to fail ──────────────────────────────────
          cat > /tmp/canary.swift <<'SWIFT'
          import shared

          // A member that has never existed on the Kotlin object the app calls.
          func ciris_ci_canary() {
              _ = IosBackendBridge.shared.ciris_ci_canary_absent_member()
          }
          SWIFT
          if xcrun swiftc -typecheck -module-name canary \
               -swift-version "$swiftver" \
               -sdk "$sdk" -target "$target" -F "$fw" $plugins \
               /tmp/canary.swift >/tmp/canary.log 2>&1; then
            echo "::error::the canary type-checked — the Swift is NOT resolved against shared.framework, so the check below proves nothing"
            exit 1
          fi
          if grep -q "no such module 'shared'" /tmp/canary.log; then
            echo "::error::shared.framework did not load from $fw"
            cat /tmp/canary.log
            exit 1
          fi
          grep -q "ciris_ci_canary_absent_member" /tmp/canary.log || {
            echo "::error::the canary failed for an unexpected reason — read this before trusting anything below"
            cat /tmp/canary.log
            exit 1
          }
          echo "canary: shared.framework loads, and an absent Kotlin member is an error"

          # ── The check ──────────────────────────────────────────────────────
          srcs=$(find iosApp -name '*.swift' | sort)
          n=$(printf '%s' "$srcs" | grep -c '\.swift$' || true)
          [ "$n" -gt 0 ] \
            || { echo "::error::no Swift sources found — this step would pass having checked nothing"; exit 1; }
          # An empty glob is not the only way to check nothing: a source set that
          # never touches `shared` would type-check happily and mean as little.
          grep -lE '^import shared$' $srcs >/dev/null || {
            echo "::error::not one Swift source imports shared — nothing here reaches the Kotlin surface"
            exit 1
          }


          echo "── type-checking $n Swift sources as one module:"
          printf '   %s\n' $srcs
          xcrun swiftc -typecheck -module-name iosApp \
                -swift-version "$swiftver" \
                -sdk "$sdk" -target "$target" -F "$fw" $plugins \
                -import-objc-header iosApp/iosApp-Bridging-Header.h \
                $srcs
          echo "the Swift type-checks against the Kotlin it calls"

      # WHAT AN ACTUAL `xcodebuild -sdk iphonesimulator` WOULD TAKE, written
      # down so the next person does not re-derive it. All three are needed;
      # the third has no path through it today.
      #
      #   1. Python.xcframework — published by NO CIRISAI repo. The only
      #      producer is a `briefcase build iOS` of CIRISAgent's ios/CirisiOS,
      #      and iosApp/scripts/prepare_python_bundle.sh reads it from a
      #      hardcoded path on one machine (/Users/macmini/CIRISAgent/…/
      #      build/ciris_ios/ios/xcode/Support/Python.xcframework). Upstream it
      #      is beeware/Python-Apple-support — release 3.10-b14 ships
      #      Python-3.10-iOS-support.b14.tar.gz and IS fetchable — but the
      #      lib-dynload layout embed_native_frameworks.sh reads out of the
      #      simulator slice is the briefcase build's, so adopting it is a port,
      #      not a download.
      #   2. CIRISVerify.xcframework — CIRISVerify DOES publish an iOS asset
      #      (ciris-verify-v14.1.0-ios.tar.gz), but the xcframework inside it is
      #      library-style and STATIC (CirisVerify.xcframework/ios-arm64-
      #      simulator/libciris_verify_ffi.a). This project requires the
      #      framework-style DYNAMIC one — iosApp/CLAUDE.md, key constraint 1:
      #      ctypes.CDLL cannot dlsym a static archive — which CIRISAgent's
      #      tools/update_ciris_verify.py --local builds. The tarball does carry
      #      the .dylib and the release carries ciris_verify.h, so it is
      #      reconstructible; doing it here means re-implementing another repo's
      #      packaging in this one, which is the defect VENDORING.md §2 refuses.
      #   3. Resources.zip — 27 MB, gitignored, and the Xcode target lists it as
      #      a SOURCE (project.yml, 14 references in project.pbxproj), so the
      #      project does not build without it. It is zipped from CIRISAgent's
      #      ciris_engine/ and ciris_adapters/ trees, which are not in this repo
      #      in any form.
      #
      # (3) is the wall: this repo owns the client, not the substrate it drives.
      # Until that changes, the type-check above is the whole of the Swift's
      # compiler coverage here — and it is the part that catches a Kotlin/Swift
      # break, which is what CIRISClient#24 was actually about.

      - name: Test iosMain (simulator target)
        working-directory: client
        # The resume/restart contract is common code and is covered by
        # desktopTest, but running the iOS test target too catches an actual
        # that compiles and then cannot link.
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :shared:iosSimulatorArm64Test | tee /tmp/iostest.log
          # Same trap as the compile step: on a host that cannot run this, the
          # task is SKIPPED and the job goes green having tested nothing.
          if grep -qE "Task :shared:iosSimulatorArm64Test (SKIPPED|NO-SOURCE)" /tmp/iostest.log; then
            echo "::error::iosSimulatorArm64Test was skipped — no tests actually ran"
            exit 1
          fi

  # ── Package. Runs whatever gradle managed, and says so ──────────────────────
  wheels:
    name: wheels
    needs: [gradle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --upgrade pip build

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gradle-*
          path: gradle-out

      - name: Stage the shipped build
        # One build, carrying every surface; which of them a user sees is
        # decided at runtime by the probed node (CIRISServer#479).
        run: |
          set -euo pipefail
          jar=$(find gradle-out/gradle-client -name '*.jar' 2>/dev/null | head -1 || true)
          if [ -n "$jar" ]; then
            python3 packaging/stage_artifacts.py \
              --artifact "desktop-uber-jar@linux-x86_64=$jar"
          else
            # Named precisely. "no gradle artifact" tells the next person to
            # look at the gradle job; a generic "unavailable" does not.
            python3 packaging/stage_artifacts.py \
              --placeholder "the gradle job produced no jar in run ${{ github.run_id }}"
          fi

      - name: Build the distribution
        run: |
          set -euo pipefail
          python3 -m build --wheel --outdir dist .
          ls -la dist

      - name: Wheel size against PyPI's limit
        # 104,857,600 bytes. "100 MB" is 100 MiB and the 4.8 MiB difference has
        # been the entire remaining margin before now.
        run: python3 packaging/check_wheel_size.py dist/*.whl

      - name: Consumption contract — install and resolve
        run: |
          set -euo pipefail
          python3 -m venv /tmp/consumer
          /tmp/consumer/bin/pip install --no-index dist/ciris_client-*.whl
          # Run from a directory that is NOT the checkout. `python -` puts the
          # CWD first on sys.path, so run here and `ciris_client/` in the repo
          # root shadows the wheel — this step then grades the source tree and
          # reports green whatever the wheel contains, which is the one failure
          # it exists to catch. publish.yml already did this; this one did not.
          mkdir -p /tmp/verify && cd /tmp/verify && /tmp/consumer/bin/python - <<'PY'
          import ciris_client as c
          # And prove it, rather than trusting the cd: a comment cannot fail.
          assert "site-packages" in c.__file__, f"resolved the source tree: {c.__file__}"
          m = c.manifest()
          print("version:", c.__version__, "built as:", m["flavor"])
          assert m["client_version"] == c.__version__, "version split"
          if m.get("placeholder"):
              # The wheel must REFUSE, not return a path to nothing.
              try:
                  c.artifact_path("desktop-uber-jar")
              except c.ArtifactUnavailable as e:
                  print("placeholder refuses as designed:", str(e).splitlines()[0])
              else:
                  raise SystemExit("placeholder payload did not refuse")
          else:
              print("desktop-uber-jar ->", c.artifact_path("desktop-uber-jar"))
          PY

      - name: Say plainly what shipped
        if: always()
        run: |
          {
            echo "### Wheel"
            echo
            p=$(python3 -c "import json;d=json.load(open('ciris_client/_artifacts/manifest.json'));print('PLACEHOLDER — '+d['placeholder_reason'] if d.get('placeholder') else ', '.join(a['kind'] for a in d['artifacts']))")
            echo '| wheel | bytes | payload |'
            echo '|---|---:|---|'
            for w in dist/*.whl; do
              echo "| \`$(basename "$w")\` | $(stat -c%s "$w") | $p |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          retention-days: 14

  # ── Drive the actual app against actual nodes ───────────────────────────────
  #
  # Everything above this line can pass for a client that never starts. The jobs
  # compile it, unit test :shared, build a jar and a wheel, and check facts about
  # PyPI -- and every defect this repo has shipped to the server team lived past
  # all of that, because it only exists once the app is RUNNING and talking to a
  # node. This job starts it, four times, against the four node configurations a
  # universal client has to be complete against.
  #
  # See testing/README.md for the matrix and for the one corner it cannot cover.
  e2e-desktop:
    name: e2e (desktop)
    needs: [gradle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: apt (hardened)
        uses: ./.github/actions/apt
        with:
          # Compose Desktop needs a display. There is no X server on a runner.
          # xvfb-run needs xauth; without it it fails with a bare "xauth: not found".
          packages: xvfb xauth

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: gradle-client
          path: jars

      - name: The node this client will be a client of
        id: node
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want="v$(cat VERSION)"
          asset_for() { echo "ciris-server-$1-x86_64-unknown-linux-gnu.tar.gz"; }
          mkdir -p node
          # The pinned version first. Client and server versions are gated to
          # move together, so that is the pairing this tree claims to work with.
          if gh release download "$want" -R CIRISAI/CIRISServer \
               -p "$(asset_for "$want")" -D node 2>/dev/null; then
            used="$want"
          else
            # NOT a silent fallback. The client can legitimately cut a version
            # before the server tags the matching one, and testing against no
            # node at all would be worse -- but which node ran is a fact the
            # report has to carry, not a detail the log buries.
            used=$(gh release view -R CIRISAI/CIRISServer --json tagName -q .tagName)
            echo "::notice::CIRISServer $want is not released yet; the walk ran against $used"
            gh release download "$used" -R CIRISAI/CIRISServer -p "$(asset_for "$used")" -D node
          fi
          tar xzf node/ciris-server-*.tar.gz -C node
          chmod +x node/ciris-server
          echo "version=$used" >> "$GITHUB_OUTPUT"
          echo "Client $(cat VERSION) walking against node $used"

      - name: Walk the matrix
        run: |
          set -euo pipefail
          jar=$(find jars -name '*.jar' -size +1M | head -1)
          test -n "$jar" || { echo "::error::no uber-jar in the gradle artifact"; exit 1; }
          python3 -m testing.run_e2e \
            --corner all \
            --jar "$jar" \
            --node-bin node/ciris-server \
            --node-version "${{ steps.node.outputs.version }}" \
            --report e2e-report.json \
            --workdir e2e-work

      - name: What the walk saw
        if: always()
        run: |
          test -f e2e-report.json || { echo "no report was written"; exit 0; }
          python3 - <<'EOF'
          import json
          r = json.load(open("e2e-report.json"))
          for c in r["corners"]:
              print(f"{c['corner']:24s} {c['status']:8s} {c['seconds']}s  screen={c['screen']!r}")
              for case in c["cases"]:
                  if case["status"] == "failed":
                      print(f"    FAILED {case['name']}: {case['detail']}")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Screenshots, node logs and app logs for every corner. A failed walk
          # is only useful if you can see what the app was showing.
          name: e2e-evidence
          path: |
            e2e-report.json
            e2e-work/*/app.log
            e2e-work/*/node.log
            e2e-work/*/failure.png
          if-no-files-found: warn
          retention-days: 14

  # ── Package. Runs whatever gradle managed, and says so ──────────────────────
