# The gate that drives the real UI on every platform we ship (CIRISClient#31).
#
# WHY THIS EXISTS. build.yml checks PARTS: the wheel builds, the types check,
# the tests pass, and e2e-desktop drives Linux. None of that asks the question a
# consumer asks — "if I install this candidate on a phone, can automation drive
# it?" — on the two platforms where automation is hardest and where every defect
# of the last month actually lived: #30, #32, #34 and #35 were all iOS or
# Android, all found downstream, and each one cost a release.
#
# The loop this replaces:
#
#     we publish -> they adopt -> their gate finds it -> we fix -> we publish
#
# THREE RUNNER IMAGES, FIVE TARGETS. Linux hosts its own desktop plus the
# Android emulator; macOS hosts its own desktop plus the iOS simulator; Windows
# hosts itself. That is the pairing CIRISAgent arrived at, and it is the reason
# the bill is three runners rather than five.
#
# ONE FLOW, FIVE TIMES. There is one Compose app exposing one TestAutomation
# server on 9091 everywhere, so nothing below contains platform-specific TEST
# logic — only platform-specific BRING-UP, which is genuinely different because
# an emulator is not a window. The bring-up lives in testing/gate/bringup.py as
# inspectable plans, unit-tested in build.yml, so the sequence is not first
# checked here at 2am against a timeout.
#
# THE NODE IS REAL. Every leg downloads a released ciris-server and the client
# talks to it: on Android through `adb reverse`, so the emulator's
# localhost:4243 IS the runner's node. That keeps the client in the REMOTE shape
# FSD/ONE_CLIENT_N_NODES.md describes and is why no Android node binary is
# needed — CIRISServer publishes none.
#
# A SECOND NODE, ONLY WHEN A FLOW ASKS. A flow with `fixture: two_node` (a
# receipt to open, a peer to pick, a room with a real message) gets a second
# ciris-server on the same runner — the binary this leg already downloaded,
# started natively on 5242/5243 with its own --home under $RUNNER_TEMP and a
# unique --key-id — claimed, announced, peered with the leg's node, and seeded
# with a contact each way and one chat message (testing/gate/two_node.py, the
# Docker-free port of CIRISServer harness/mesh-repro/scenarios/chat.sh). Every
# leg passes --node-binary; a run with no such flow never starts it. Each job
# tears it down under always(), because the flow runner's `finally` does not
# survive a SIGKILL.
#
# :4243 AND NOT :8080. A bare ciris-server has no brain and never binds the
# agent's port; see .github/actions/ciris-node. This comment said 8080 for the
# whole life of the gate, and so did every probe and forward under it.
#
# NO .env SEEDING IS NEEDED, and an earlier version of this comment claimed
# otherwise. The claim was: `backendEndpoint()` reads an ABSENT
# `CIRIS_RUN_WITHOUT_AI` as "with AI" (:8080), so the gate must write the flag
# into each platform's home or drive a client pointed at a port it does not run.
#
# That was wrong, and wrong in the direction that invents work. With no .env
# the endpoint resolves to AGENT, and `syncBackendFrom` then moves the client
# to :8080 ONLY IF A BRAIN ANSWERS THERE (CIRISClient#54 — before that fix the
# agent branch did not exist at all, and the client simply stayed on Main.kt's
# `:4243` default). These desktops run a bare ciris-server and nothing on
# :8080, so the probe fails and nothing moves. Same outcome, and now for a
# reason that also serves the shipped with-AI install instead of only this
# gate. `BackendSyncAgentBranchTest` pins the "nothing on :8080 → stay on the
# node" case by name, because this gate depends on it.
#
# Settled by evidence rather than by re-reading: all three desktops report
#     [OK ] state: clientMode=NODE node=http://127.0.0.1:4243
# and pass the walk end to end.
#
# WHAT MAKES IT A GATE RATHER THAN A REPORT, and each is guarded by
# tests/test_five_platform_workflow.py because a gate that can be quietly
# defeated is worse than none:
#   * fail-fast is OFF — killing the matrix on first red destroys the five-way
#     comparison that makes a platform-specific defect obvious
#   * artifacts upload with always() — a failure you cannot diagnose from the
#     artifact costs a re-run to learn what the first run already knew
#   * the gallery job runs on failure — the red run is the one worth looking at
#   * every leg has a timeout — a hung emulator must not burn six hours
#   * a platform that cannot run FAILS; it never skips quietly
#   * ONE SERVER VERSION PER RUN (CIRISClient#166). The `server` job resolves
#     it once — the compat pin's release tag, or the latest release WITH A
#     WARNING when the pin is a branch commit, or the `server_version` input —
#     and every leg reads `needs.server.outputs.version`: the binary it
#     downloads, the `ciris-server==` the Android build installs, the version
#     on its board line and in the gallery. Run 39023854089 drove two legs
#     against v0.5.228 and three against v0.5.229, because each picked its
#     own. The iOS simulator app embeds CIRISAgent's pinned node and cannot be
#     handed the run's; its board says both (`--embedded-node-version`).
#   * OPTIONAL SKIPS ARE COUNTED AND RATCHETED (CIRISClient#168). Each leg's
#     board carries its `SKIP (optional)` count per flow and judges it against
#     testing/flows/optional_skips_baseline.json: a rise is red, a fall is
#     STALE until re-recorded (testing/gate/optional_skips.py).

name: Five-Platform Live QA

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Subset to run (space-separated: linux windows android ios), or 'all'"
        required: false
        default: "all"
        type: string
      server_version:
        description: "CIRISServer release tag every leg runs against (vX.Y.Z); empty = the compat pin (client/VENDORING.md §1), or the latest release with a warning when the pin is not a released tag"
        required: false
        default: ""
        type: string
      # THE RELEASE GATE (CIRISClient#166): the node-only matrix below, PLUS
      # with-AI legs that install the run's ONE ciris-agent, drive the wizard
      # through the AI step with the ANTHROPIC_API_KEY secret, and talk to a
      # real model. Off (the default, and always on `schedule`), nothing about
      # the node-only matrix changes: the with-AI jobs do not run, and the
      # inputs below are read by nothing.
      with_ai:
        description: "Also run the with-AI legs (Linux and Windows desktops) against ciris-agent with a real model"
        required: false
        default: false
        type: boolean
      agent_version:
        description: "with_ai: the ciris-agent to install (2.16.2 or v2.16.2-stable); empty = CIRISAgent's latest release"
        required: false
        default: ""
        type: string
      llm_model:
        description: "with_ai: the Anthropic model the wizard picks from the live list (never substituted)"
        required: false
        default: "claude-sonnet-5-5"
        type: string
      candidate_version:
        description: "The version this candidate releases as, for flows' `client: >X` floors (e.g. 0.5.229 before VERSION is bumped); empty = VERSION"
        required: false
        default: ""
        type: string
  # Nightly, not per-push: it boots an emulator and a simulator, which is too
  # slow and too costly to gate every commit. A nightly failure lands before the
  # next tag, which is the moment that matters.
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: five-platform-live-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CIRIS_AGENT_ROOT: ${{ github.workspace }}/.agent
  # EVERY HARNESS RUN IS A QA RUN (CIRISClient#182). The with-AI legs talk to
  # a real model through a real agent, and its traces must say `qa`, never
  # `production`. Workflow-level so no leg can be the one that forgot; the
  # desktop client and the pip-installed agent inherit it, the Android and iOS
  # bring-ups forward it (testing/gate/bringup.py).
  CIRIS_TRACE_RUN_KIND: qa
  # THE APP SERVES /health ON 9091 ONLY IN TEST MODE, AND NOTHING SET IT.
  #
  # `TestAutomationServer.isTestModeEnabled()` reads CIRIS_TEST_MODE and the
  # desktop starts its automation server only when that is true. The workflow
  # never set it, so every desktop leg launched an app with no automation
  # server and then failed the one thing it exists to prove:
  #
  #   [OK ] bring-up: launch
  #   [FAIL] drive: automation server never came up within 120s:
  #          GET /health -> no answer from http://127.0.0.1:9091
  #
  # Job-level rather than per-leg: three legs need it and a fourth would forget.
  # Android arms the same switch with a sentinel file instead (an `am start`
  # cannot set the environment of the process it launches — see bringup.py's
  # ANDROID_TEST_SENTINEL), which is why that leg does not depend on this.
  CIRIS_TEST_MODE: "true"

jobs:
  # THE ONE PLACE THE SERVER VERSION IS DECIDED. Every leg `needs:` this job
  # and reads its outputs; no leg looks a version up on its own
  # (testing/test_five_platform_workflow.py asserts exactly one source).
  server:
    name: one server version for every leg
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
      pypi: ${{ steps.pick.outputs.pypi }}
      source: ${{ steps.pick.outputs.source }}
      pin: ${{ steps.pick.outputs.pin }}
      pin_label: ${{ steps.pick.outputs.pin_label }}
      # The with-AI legs' ONE agent (empty unless with_ai): the PyPI version
      # they install and the ciris-server that agent pins and folds in.
      agent_tag: ${{ steps.agent.outputs.agent_tag }}
      agent_pypi: ${{ steps.agent.outputs.agent_pypi }}
      agent_server: ${{ steps.agent.outputs.agent_server }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the run's server version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m testing.gate.server_version --override "${{ inputs.server_version }}" --github-output "$GITHUB_OUTPUT" --json
          echo "::notice::every leg runs against CIRISServer $(grep '^version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2) ($(grep '^source=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2))"

      # THE ONE PLACE THE AGENT VERSION IS DECIDED, beside the server's and for
      # the same reason: "pip install ciris-agent" on three runners is three
      # reads of a moving target. Only when asked for.
      - name: Resolve the run's agent version (with AI only)
        id: agent
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_ai }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m testing.gate.agent_version --override "${{ inputs.agent_version }}" --github-output "$GITHUB_OUTPUT" --json
          echo "::notice::every with-AI leg runs ciris-agent $(grep '^agent_pypi=' "$GITHUB_OUTPUT" | cut -d= -f2) ($(grep '^agent_tag=' "$GITHUB_OUTPUT" | cut -d= -f2)), whose node is ciris-server $(grep '^agent_server=' "$GITHUB_OUTPUT" | cut -d= -f2)"

  linux-android:
    name: linux desktop + android emulator
    needs: [server]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux') || contains(inputs.platforms, 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The Android build stages a Python runtime from a CIRISAgent checkout;
      # this tree deliberately does not vendor it (client/VENDORING.md §2).
      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          path: .agent

      - uses: ./.github/actions/apt
        with:
          packages: xvfb xauth

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # CHAQUOPY NEEDS A REAL 3.10, AND THE IMAGE STOPPED HAVING ONE.
      # `ubuntu-latest` moved to 24.04 (Python 3.12), so the hardcoded
      # /usr/bin/python3.10 in androidApp/build.gradle vanished and this leg has
      # died at :androidApp:installDebugPythonRequirements every night since.
      # Provision it explicitly and hand Gradle the path, rather than hoping the
      # image keeps a version it no longer ships.
      - uses: actions/setup-python@v5
        id: py310
        with:
          python-version: '3.10'

      # THE CSD FLOWS NEED PyYAML (testing/gate/flow_spec.py reads the flow and
      # its CSD's typed blocks). Everything else the legs run is stdlib; this is
      # the one install, and it goes into the interpreter every leg below uses.
      - name: The flow runner's one dependency
        run: python3 -m pip install --quiet pyyaml

      # THE RUN'S VERSION, NOT THIS LEG'S. Resolved once by the `server` job.
      - name: The node this client will be a client of
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p node
          gh release download "${{ needs.server.outputs.version }}" -R CIRISAI/CIRISServer -p "ciris-server-${{ needs.server.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz" -D node
          tar xzf node/ciris-server-*.tar.gz -C node
          chmod +x node/ciris-server
          echo "server ${{ needs.server.outputs.version }} (${{ needs.server.outputs.source }})"

      # REHYDRATE THE ANDROID WHEELS. `client/androidApp/wheels/` is a §2
      # never-vendor class — 86 MB of other repos' release artifacts that this
      # tree deliberately does not carry, because a copy here would be a third
      # one drifting against the two that already exist (VENDORING.md §2).
      #
      # The consequence is that `:androidApp:assembleDebug` CANNOT build from a
      # clean checkout. Chaquopy's `--find-links wheels` finds no directory
      # ("Location 'wheels' is ignored"), falls through to PyPI, and dies on
      # `No matching distribution found for pydantic-core==2.23.4 (from
      # versions: 0.0.1)` — 2.23.4 exists for Android and NOT under PyPI's
      # generic tags, so no amount of pip flags will produce it.
      #
      # COPIED FROM THE CHECKOUT THIS JOB ALREADY MAKES, not fetched. The six
      # wheels live in CIRISAgent at apps/android/wheels/ — 3 ciris_server and
      # 3 pydantic_core, one per ABI — which is the same set §2 lists, and this
      # job already clones that repo into .agent for the Python runtime. So the
      # artifacts come from the repo that owns them, are staged rather than
      # vendored, and no network fetch or credential is involved.
      #
      # `ciris-server` itself is NOT taken from here: the build pins an exact
      # version from PyPI (androidApp/build.gradle), whose Android wheel does
      # publish. Only the dependencies that PyPI cannot serve for Android need
      # staging, which is why a stale ciris_server wheel in this set is harmless.
      - name: Rehydrate the Android wheels (§2 never-vendor, staged not carried)
        run: |
          set -euo pipefail
          src=.agent/apps/android/wheels
          test -d "$src" || {
            echo "::error::$src is absent — CIRISAgent's layout moved, and"
            echo "::error::androidApp cannot build without the §2 wheels"
            exit 1; }
          mkdir -p client/androidApp/wheels
          cp "$src"/*.whl client/androidApp/wheels/
          count=$(find client/androidApp/wheels -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')
          # A silently empty stage would fail later as a confusing pip error,
          # which is how this cost a run in the first place.
          test "$count" -gt 0 || { echo "::error::staged no wheels"; exit 1; }
          echo "staged $count wheel(s) from $src:"
          find client/androidApp/wheels -maxdepth 1 -name '*.whl' -exec basename {} \;

      - name: Build the candidate
        run: |
          set -euo pipefail
          cd client
          # -PcirisServerVersion: the APK's embedded `ciris-server==` is the
          # run's release, not a hand-bumped literal (androidApp/build.gradle).
          ./gradlew :desktopApp:packageUberJarForCurrentOS :androidApp:assembleDebug \
            -PcirisAgentRoot="$CIRIS_AGENT_ROOT" \
            -PcirisServerVersion=${{ needs.server.outputs.pypi }} \
            -PchaquopyBuildPython="${{ steps.py310.outputs.python-path }}" --console=plain

      # THE CANDIDATE, NOT WHATEVER IS ON DISK. This asserts the artifact
      # carries this tree's version -- "freshest on disk" and "built from this
      # tree" are different questions, and answering the first while meaning the
      # second reports a platform green for code that is not the candidate.
      - name: Resolve the artifacts
        id: art
        run: |
          set -euo pipefail
          echo "jar=$(python3 -m testing.gate.candidate_artifacts --kind desktop | tail -1)" >> "$GITHUB_OUTPUT"
          echo "apk=$(python3 -m testing.gate.candidate_artifacts --kind android_apk | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Start the node
        uses: ./.github/actions/ciris-node

      # THE SMOKE WALK, THEN THE CSD FLOWS, IN ONE PROCESS AGAINST ONE APP.
      # `--flows` runs every testing/flows/*.yaml after the walk passes, in the
      # app the walk just proved, signing in once (session_fixture). A flow
      # refused by its `client:` floor is reported and does not redden the leg;
      # a flow that fails, or never reaches its first screen, does. See
      # testing/flows/README.md. Every leg below passes the same flag.
      - name: Linux desktop
        run: |
          python3 -m testing.gate.run_platform --platform desktop --xvfb \
            --jar "${{ steps.art.outputs.jar }}" \
            --node-version "${{ needs.server.outputs.version }}" \
            --shots shots --report reports/linux.json --flows testing/flows ${{ inputs.candidate_version && format('--client-version {0}', inputs.candidate_version) || '' }} \
            --node-binary node/ciris-server --peer-work "$RUNNER_TEMP/two-node-linux"

      # THE ANDROID LEG SHARES THIS NODE, AND THE FIXTURE CHANGED IT. A
      # `fixture: two_node` flow on the desktop leg leaves the node with a
      # contact and a room; the Android leg's bare-node flows ("People with no
      # contacts yet") would then fail for the desktop's reason. So when the
      # fixture ran (it writes values.json), the Android leg gets a fresh node
      # on a fresh home, and claims it through its own wizard like any first run.
      - name: Was the node seeded by the two-node fixture?
        id: seeded
        if: always()
        run: |
          python3 -m testing.gate.two_node down --work "$RUNNER_TEMP/two-node-linux" || true
          if [ -f "$RUNNER_TEMP/two-node-linux/values.json" ]; then
            echo "seeded=true" >> "$GITHUB_OUTPUT"
            for port in 4242 4243; do
              pids=$(sudo lsof -ti "tcp:$port" -sTCP:LISTEN 2>/dev/null || true)
              [ -n "$pids" ] && { echo "stopping the seeded node on :$port ($pids)"; sudo kill $pids || true; }
            done
            sleep 2
          else
            echo "seeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: A fresh node for the Android leg
        if: steps.seeded.outputs.seeded == 'true'
        uses: ./.github/actions/ciris-node
        with:
          home: ${{ runner.temp }}/ciris-home-android
          log: node-android.log

      # WITHOUT THIS THE EMULATOR RUNS IN SOFTWARE AND DIES.
      #
      # The runner HAS /dev/kvm and the `runner` user is not in the `kvm`
      # group, so the emulator probed it, gave up, and fell back to pure
      # software emulation:
      #
      #     ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm).
      #     The KVM line in /etc/group is: [kvm:x:993:]
      #     Disabling Linux hardware acceleration.
      #
      # That is a 346-second boot, after which the watchdog killed
      # system_server outright — `android.os.DeadSystemException` — and the leg
      # failed before run_platform could write a report. Every Android failure
      # this workflow has ever produced traces back here; none of them was the
      # client. The udev rule is what reactivecircus/android-emulator-runner
      # documents for ubuntu runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          # AN ATD IMAGE, BECAUSE THE FULL ONE CANNOT CARRY THIS.
          #
          # On the default image the emulator took 424 SECONDS to boot and then
          # System UI itself ANR'd -- the failure screenshot is the launcher
          # showing "System UI isn't responding", with our app nowhere on it.
          # The app was installed and launched; it never got enough CPU to
          # start its test server, so the leg failed with "automation server
          # never came up within 120s" and read like a client defect.
          #
          # WAS aosp_atd, AND THAT WAS A GUESS THAT COST A RUN. The ATD image
          # was added to fight a 424-second boot; the actual cause was KVM being
          # unavailable (see the step above), and with acceleration the full
          # image is fast enough. On ATD the app never started at all — repeated
          # `am start` with no `Start proc` and no crash — so the image is a
          # variable worth removing before reading anything else into it.
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # ONE LINE, NO CONTINUATIONS. `script:` is not a `run:` block —
          # android-emulator-runner hands it to the emulator wrapper, which does
          # not honour backslash-newline, so each `\` arrived as a literal
          # argument and argparse said:
          #
          #     run_platform.py: error: unrecognized arguments: \
          #
          # after the emulator had booted and the whole leg had been paid for.
          # It reads worse on one line and it is the form that runs.
          script: python3 -m testing.gate.run_platform --platform android --apk "${{ steps.art.outputs.apk }}" --node-version "${{ needs.server.outputs.version }}" --shots shots --report reports/android.json --flows testing/flows ${{ inputs.candidate_version && format('--client-version {0}', inputs.candidate_version) || '' }} --node-binary node/ciris-server --peer-work "$RUNNER_TEMP/two-node-android"; rc=$?; adb logcat -d > logcat.txt 2>&1; exit $rc

      # THE PEER DIES WITH THE JOB, WHATEVER KILLED IT. The runner's `finally`
      # and its SIGTERM handler cover a failed flow and a cancelled step; this
      # covers the rest, by the pidfile each leg's fixture wrote.
      - name: Tear down the two-node peers
        if: always()
        run: |
          for leg in linux android; do
            python3 -m testing.gate.two_node down --work "$RUNNER_TEMP/two-node-$leg" || true
          done

      # ALWAYS. A failure you cannot diagnose from the artifact costs a re-run
      # to learn what this run already knew.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-linux-android
          path: |
            shots/
            reports/
            node.log
            node-android.log
            *-app.log
            logcat.txt
            ${{ runner.temp }}/two-node-*/peer.log
            ${{ runner.temp }}/two-node-*/values.json

  macos-ios:
    name: macos desktop + ios simulator
    needs: [server]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos') || contains(inputs.platforms, 'ios') }}
    # macos-15, NOT macos-14. `client/iosApp/iosApp.xcodeproj` is
    # `objectVersion = 77` -- the Xcode 16 project format -- and macos-14 ships
    # Xcode 15.4, which cannot read it:
    #
    #     xcodebuild: error: Unable to read project 'iosApp.xcodeproj'
    #
    # That is why the iOS leg has never once passed here (17 runs, 17
    # failures). It is not a regression, and no client change would have fixed
    # it: the runner could not open the project.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A PROVISIONED INTERPRETER for the macOS desktop leg, so the flow runner's
      # PyYAML goes into a Python this job owns rather than the image's
      # externally-managed one. The iOS leg switches to 3.10 further down and
      # installs it again there.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The flow runner's one dependency
        run: python3 -m pip install --quiet pyyaml

      # THE RUN'S VERSION, NOT THIS LEG'S. Resolved once by the `server` job.
      - name: The node this client will be a client of
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p node
          gh release download "${{ needs.server.outputs.version }}" -R CIRISAI/CIRISServer -p "ciris-server-${{ needs.server.outputs.version }}-aarch64-apple-darwin.tar.gz" -D node
          tar xzf node/ciris-server-*.tar.gz -C node
          chmod +x node/ciris-server
          echo "server ${{ needs.server.outputs.version }} (${{ needs.server.outputs.source }})"

      - name: Build the candidate
        run: cd client && ./gradlew :desktopApp:packageUberJarForCurrentOS --console=plain

      - name: Start the node
        uses: ./.github/actions/ciris-node

      - name: macOS desktop
        run: |
          python3 -m testing.gate.run_platform --platform desktop \
            --jar "$(python3 -m testing.gate.candidate_artifacts --kind desktop | tail -1)" \
            --node-version "${{ needs.server.outputs.version }}" \
            --shots shots --report reports/macos.json --flows testing/flows ${{ inputs.candidate_version && format('--client-version {0}', inputs.candidate_version) || '' }} \
            --node-binary node/ciris-server --peer-work "$RUNNER_TEMP/two-node-macos"

      # THE iOS APP, BUILT THE ONE WAY (.github/actions/ios-sim-app): the
      # agent's substrate, the simulator natives, the XCFramework and the app,
      # then :4242/:4243/:8080 freed (this job's desktop node held them) and an
      # iPhone booted. The node-only leg embeds the agent's default branch.
      - name: Build the iOS simulator app
        id: ios
        uses: ./.github/actions/ios-sim-app
        with:
          run-server-version: ${{ needs.server.outputs.version }}

      # iOS is the leg most likely to be red for reasons of its own, and it runs
      # LAST so a macOS desktop result exists either way.
      - name: iOS simulator
        run: |
          set -euo pipefail
          # `python3` is the 3.10 set up above now, not the 3.12 the macOS leg
          # installed PyYAML into — the flow runner needs it here too.
          python3 -m pip install --quiet pyyaml
          app="${{ steps.ios.outputs.app }}"
          UDID="${{ steps.ios.outputs.udid }}"
          # The macOS leg's peer, if its runner was killed before `finally`:
          # 5242/5243 must be free for this leg's own.
          python3 -m testing.gate.two_node down --work "$RUNNER_TEMP/two-node-macos" || true
          rc=0
          # The simulator shares the runner's loopback, so the node the app
          # embeds is 127.0.0.1:4243 from here too — the fixture's --node-url
          # default — and the peer on 5242/5243 does not collide with it.
          python3 -m testing.gate.run_platform --platform ios --app "$app" --udid "$UDID" \
            --node-version "${{ needs.server.outputs.version }}" \
            --embedded-node-version "${{ steps.ios.outputs.embedded }}" \
            --shots shots --report reports/ios.json --flows testing/flows ${{ inputs.candidate_version && format('--client-version {0}', inputs.candidate_version) || '' }} \
            --node-binary node/ciris-server --peer-work "$RUNNER_TEMP/two-node-ios" || rc=$?

          # THE APP'S OWN ACCOUNT, EITHER WAY. Run 35359571538 got the iOS app
          # to a real screen — "Engine Failed to Start: server did not become
          # healthy within 30 seconds" — and the artifact carried nothing that
          # said why: os_log is the only place a Swift/Kotlin line lands, and
          # the embedded interpreter writes its own failure report to
          # Documents/python_error.log (the traceback of why kmp_main did not
          # start) with the engine's logs under Documents/ciris/logs. The
          # agent's driver collects exactly this set; so does this leg now.
          # THE CAPTURE NEVER DECIDES THE VERDICT. This block runs under the
          # step's `set -e`; a grep with no match exits 1, and run 35379942066
          # — the first in which the iOS walk passed, every step [OK ] and
          # `ios: PASS` printed — was reported failed by the diagnostic that
          # followed it. Only $rc, the walk's own exit, leaves this step.
          set +e
          mkdir -p ios-logs
          xcrun simctl spawn "$UDID" log show --last 15m --style syslog \
            --predicate 'process == "iosApp" OR subsystem CONTAINS "ai.ciris.mobile"' \
            > ios-logs/oslog.txt 2>&1 || true
          echo "oslog: $(wc -l < ios-logs/oslog.txt) lines"
          APPBOX=$(xcrun simctl get_app_container "$UDID" ai.ciris.mobile app 2>/dev/null || true)
          if [ -n "$APPBOX" ] && [ -d "$APPBOX/Frameworks" ]; then
            ls "$APPBOX/Frameworks" > ios-logs/app-frameworks.txt
            echo "app Frameworks/: $(wc -l < ios-logs/app-frameworks.txt) entries; _struct.framework $(grep -q '^_struct.framework$' ios-logs/app-frameworks.txt && echo present || echo MISSING)"
          fi
          DATABOX=$(xcrun simctl get_app_container "$UDID" ai.ciris.mobile data 2>/dev/null || true)
          if [ -n "$DATABOX" ] && [ -d "$DATABOX/Documents" ]; then
            find "$DATABOX/Documents" -maxdepth 1 -name "*.log" -exec cp {} ios-logs/ \; 2>/dev/null || true
            if [ -d "$DATABOX/Documents/ciris" ]; then
              # `*.log*`, not `*.log`: the substrate's Rust tracing lands in
              # ciris-server.log.<date>, and that is the file that says which
              # keystore path edge opened and what it found there. Run
              # 35368634186 failed on "could not open the sealed Ed25519 node
              # identity" and the one log that explains it was left behind.
              find "$DATABOX/Documents/ciris" \( -name "*.log*" -o -name "*.txt" \) -type f -exec cp {} ios-logs/ \; 2>/dev/null || true
              echo "--- identity dir ---"; ls -la "$DATABOX/Documents/ciris/identity" 2>/dev/null || echo "(no identity dir)"
              find "$DATABOX/Documents/ciris" -maxdepth 3 -type d | sed "s#$DATABOX/Documents/ciris#<ciris>#" | head -40
            fi
            echo "app logs: $(ls ios-logs | wc -l) file(s)"
            for f in ios-logs/python_error.log ios-logs/incidents_latest.log; do
              [ -f "$f" ] && { echo "--- $f (last 40 lines) ---"; tail -40 "$f"; }
            done
            for f in ios-logs/ciris-server.log*; do
              [ -f "$f" ] && { echo "--- $f: keystore / identity lines ---"; grep -i "keystore\|ed25519\|identity\|provision\|sealed\|alias" "$f" | tail -40; }
            done
          else
            echo "app logs: no Documents in the data container — the app had not started writing"
          fi
          exit $rc

      # #50'S RECORD, WHATEVER HAPPENED ABOVE. PR #200 makes the iOS client
      # write `Documents/ciris/logs/kotlin_crash.log` BEFORE it logs a crash,
      # so that file is the one account of #50's SIGABRT at the wizard's AI
      # step. The capture inside the step above runs only when the step gets
      # that far; a crash that kills the walk early, or a step that dies under
      # `set -e`, would leave it behind. So it is collected again here, under
      # always(), from the app's data container — present or said absent.
      - name: Collect the iOS crash record (kotlin_crash.log, CIRISClient#50)
        if: always()
        run: |
          set +e
          mkdir -p ios-logs
          udid="${IOS_UDID:-booted}"
          box=$(xcrun simctl get_app_container "$udid" ai.ciris.mobile data 2>/dev/null)
          f="$box/Documents/ciris/logs/kotlin_crash.log"
          if [ -n "$box" ] && [ -f "$f" ]; then
            cp "$f" ios-logs/kotlin_crash.log
            echo "::warning::the iOS app wrote a crash record ($(wc -l < "$f") lines) — ios-logs/kotlin_crash.log"
            tail -60 "$f"
          else
            echo "no kotlin_crash.log in ${box:-<no data container for ai.ciris.mobile on $udid>}/Documents/ciris/logs — the app recorded no crash"
          fi
          # A NATIVE CRASH LEAVES NO kotlin_crash.log. Release run 39830942607:
          # the app died `exited due to SIGSEGV | sent by exc handler` 155 ms
          # after the contact code rendered, and nothing named the frame. The
          # simulator's own report does; the with-AI leg already keeps it.
          mkdir -p ios-logs/diagnostic-reports
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name "iosApp*" -type f -exec cp {} ios-logs/diagnostic-reports/ \; 2>/dev/null
          echo "crash reports: $(ls ios-logs/diagnostic-reports | wc -l)"
          for r in ios-logs/diagnostic-reports/*.ips; do
            [ -f "$r" ] || continue
            echo "::warning::native crash report $(basename "$r")"
            python3 - "$r" <<'PY' || true
          import json, sys
          raw = open(sys.argv[1]).read().split("\n", 1)
          body = json.loads(raw[1] if len(raw) > 1 else raw[0])
          print("exception:", body.get("exception"), "| termination:", body.get("termination", {}).get("indicator"))
          images = body.get("usedImages", [])
          t = body.get("threads", [])[body.get("faultingThread", 0)] if body.get("threads") else {}
          for f in t.get("frames", [])[:25]:
              img = images[f["imageIndex"]].get("name", "?") if f.get("imageIndex", -1) < len(images) else "?"
              print(f"  {img:28s} {f.get('symbol', hex(f.get('imageOffset', 0)))}")
          PY
          done
          exit 0

      - name: Tear down the two-node peers
        if: always()
        run: |
          for leg in macos ios; do
            python3 -m testing.gate.two_node down --work "$RUNNER_TEMP/two-node-$leg" || true
          done

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-macos-ios
          path: |
            shots/
            reports/
            node.log
            *-app.log
            ios-logs/
            ios-logs/kotlin_crash.log
            ${{ runner.temp }}/two-node-*/peer.log
            ${{ runner.temp }}/two-node-*/values.json
            client/iosApp/app_packages_native_sim/MANIFEST.txt
            client/iosApp/substrate.lock.json

  windows:
    name: windows desktop
    needs: [server]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # THE RUN'S VERSION, NOT THIS LEG'S. Resolved once by the `server` job.
      - name: The node this client will be a client of
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node
          gh release download "${{ needs.server.outputs.version }}" -R CIRISAI/CIRISServer -p "ciris-server-${{ needs.server.outputs.version }}-x86_64-pc-windows-msvc.tar.gz" -D node
          tar xzf node/ciris-server-*.tar.gz -C node
          echo "server ${{ needs.server.outputs.version }} (${{ needs.server.outputs.source }})"

      - name: Build the candidate
        shell: bash
        run: cd client && ./gradlew :desktopApp:packageUberJarForCurrentOS --console=plain

      - name: Start the node
        uses: ./.github/actions/ciris-node

      - name: Windows desktop
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m testing.gate.run_platform --platform desktop \
            --jar "$(python3 -m testing.gate.candidate_artifacts --kind desktop | tail -1)" \
            --node-version "${{ needs.server.outputs.version }}" \
            --shots shots --report reports/windows.json --flows testing/flows ${{ inputs.candidate_version && format('--client-version {0}', inputs.candidate_version) || '' }} \
            --node-binary node/ciris-server --peer-work "$RUNNER_TEMP/two-node-windows"

      - name: Tear down the two-node peer
        if: always()
        shell: bash
        run: python3 -m testing.gate.two_node down --work "$RUNNER_TEMP/two-node-windows" || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-windows
          path: |
            shots/
            reports/
            node.log
            *-app.log
            ${{ runner.temp }}/two-node-*/peer.log
            ${{ runner.temp }}/two-node-*/values.json

  # ── WITH AI: THE RELEASE GATE (CIRISClient#166) ────────────────────────────
  #
  # The node-only legs above answer "can automation drive the candidate against
  # a bare node?". These answer the question a with-AI user asks: install the
  # LATEST agent, set it up through the real wizard with a real model key,
  # type a message, get an answer. They run only on a dispatch with
  # `with_ai: true`, and nothing above reads their inputs, so the node-only
  # matrix is exactly what it was when `with_ai` is false.
  #
  # ONE AGENT PER RUN. The `server` job resolves it (testing/gate/agent_version
  # .py: the input, or CIRISAgent's latest release, checked against PyPI); each
  # with-AI leg installs exactly that `ciris-agent==` into a venv and starts it
  # headless (.github/actions/ciris-agent). The agent folds in its OWN pinned
  # ciris-server and binds :4243 itself, so these legs start no standalone node
  # — the board names that node as the agent's (`--node-version v<its pin>`),
  # not the run's server, which these legs do not run.
  #
  # THE KEY. `secrets.ANTHROPIC_API_KEY` reaches exactly one process per leg —
  # the harness, as an environment variable read by NAME (--llm-key-env); it is
  # masked in the log, typed into a sensitive sink the client never echoes
  # (SetupApiKeySinkTest), and every file an upload would carry is scanned for
  # it first (testing/gate/secret_scan.py) — a hit is overwritten and fails the
  # leg. The agent's .env, which holds the key by design, is never uploaded.
  #
  # NOT REACHABLE IN CI, SAID ONCE HERE: a Google sign-in (the hosted proxy's
  # free credits, the billing token #171/#172 renew, purchases); a forced
  # RESOURCE_SHED (#173 — the agent has no test hook); macOS desktop with AI
  # (the macOS runner's iOS leg is already the with-AI bundle).
  # NO ANDROID WITH AI, AND WHY (run 39155407162). This repo's APK is the NODE
  # client: MainActivity pins `apiBaseUrl` and `nodeBaseUrl` to :4243
  # (CIRISBuild.HAS_AGENT == false) and the app resolves NODE_ONLY
  # ("[BACKEND] serving on :4243/health"). With the runner's agent reversed to
  # the emulator's :8080, the wizard still OFFERED "with an AI assistant" — the
  # brain is visible through the node's fold — and then every brain route went
  # to :4243 and 404'd: `[listModels] API returned error status: 404 Not Found`
  # five times, so the AI step can never finish. A with-AI Android leg needs an
  # APK that addresses a brain; the with-AI phone is CIRISAgent's build, whose
  # gate drives it.
  linux-ai:
    name: linux desktop, with AI
    needs: [server]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_ai && (inputs.platforms == 'all' || contains(inputs.platforms, 'linux')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apt
        with:
          packages: xvfb xauth

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The flow runner's one dependency
        run: python3 -m pip install --quiet pyyaml

      - name: Build the candidate
        run: cd client && ./gradlew :desktopApp:packageUberJarForCurrentOS --console=plain

      - name: Resolve the artifact
        id: art
        run: echo "jar=$(python3 -m testing.gate.candidate_artifacts --kind desktop | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Start the agent (the run's ONE ciris-agent, first run)
        uses: ./.github/actions/ciris-agent
        with:
          version: ${{ needs.server.outputs.agent_pypi }}
          home: ${{ runner.temp }}/ciris-ai-linux
          log: agent-linux.log

      # THE CLIENT SHARES THE AGENT'S HOME: it reads the claim PIN file the
      # node declares and writes the .env the agent reads (the billing token
      # hand-off), as a desktop install does under the launcher.
      - name: Linux desktop, with AI
        env:
          CIRIS_HOME: ${{ runner.temp }}/ciris-ai-linux
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -m testing.gate.run_platform --platform desktop --xvfb \
            --jar "${{ steps.art.outputs.jar }}" \
            --with-ai --agent-version "${{ needs.server.outputs.agent_pypi }}" \
            --llm-provider anthropic --llm-model "${{ inputs.llm_model }}" --llm-key-env ANTHROPIC_API_KEY \
            --node-version "v${{ needs.server.outputs.agent_server }}" \
            --shots shots --report reports/linux-ai.json --flows testing/flows/agent ${{ inputs.candidate_version && format('--client-version {0}', inputs.candidate_version) || '' }}

      # BEFORE THE UPLOAD, EVERY TIME. Copies the agent's own logs (never its
      # .env) beside the leg's evidence, then scans all of it for the key.
      - name: No artifact carries the provider key
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p agent-logs/linux
          cp -R "$RUNNER_TEMP/ciris-ai-linux/logs/." agent-logs/linux/ 2>/dev/null || true
          python3 -m testing.gate.secret_scan --env ANTHROPIC_API_KEY \
            shots reports agent-logs agent-linux.log $(ls *-app.log 2>/dev/null)

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-linux-ai
          path: |
            shots/
            reports/
            agent-logs/
            agent-linux.log
            *-app.log

  windows-ai:
    name: windows desktop, with AI
    needs: [server]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_ai && (inputs.platforms == 'all' || contains(inputs.platforms, 'windows')) }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the candidate
        shell: bash
        run: cd client && ./gradlew :desktopApp:packageUberJarForCurrentOS --console=plain

      - name: Start the agent (the run's ONE ciris-agent, first run)
        uses: ./.github/actions/ciris-agent
        with:
          version: ${{ needs.server.outputs.agent_pypi }}
          home: ${{ runner.temp }}/ciris-ai-windows
          log: agent-windows.log

      - name: Windows desktop, with AI
        shell: bash
        env:
          CIRIS_HOME: ${{ runner.temp }}/ciris-ai-windows
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m testing.gate.run_platform --platform desktop \
            --jar "$(python3 -m testing.gate.candidate_artifacts --kind desktop | tail -1)" \
            --with-ai --agent-version "${{ needs.server.outputs.agent_pypi }}" \
            --llm-provider anthropic --llm-model "${{ inputs.llm_model }}" --llm-key-env ANTHROPIC_API_KEY \
            --node-version "v${{ needs.server.outputs.agent_server }}" \
            --shots shots --report reports/windows-ai.json --flows testing/flows/agent ${{ inputs.candidate_version && format('--client-version {0}', inputs.candidate_version) || '' }}

      - name: No artifact carries the provider key
        if: always()
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p agent-logs/windows
          cp -R "$RUNNER_TEMP/ciris-ai-windows/logs/." agent-logs/windows/ 2>/dev/null || true
          python3 -m testing.gate.secret_scan --env ANTHROPIC_API_KEY \
            shots reports agent-logs agent-windows.log $(ls *-app.log 2>/dev/null)

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-windows-ai
          path: |
            shots/
            reports/
            agent-logs/
            agent-windows.log
            *-app.log

  # iOS WITH AI (CIRISClient#50). #50 is a SIGABRT as the iOS wizard enters
  # the AI step; the node-only `macos-ios` leg answers "run without AI" and so
  # never composes that step. No host agent is needed to get there, and none is
  # started: the simulator app's EMBEDDED runtime is the agent — Main.ios.kt
  # points the client at 127.0.0.1:8080, the bundle's CIRISAgent engine
  # (ciris_ios.kmp_main), and "without AI" is what stops that brain. So this
  # leg builds the same app (.github/actions/ios-sim-app) from the run's ONE
  # agent tag, answers WITH, and types the key into the AI step. A host
  # ciris-agent here would hold :8080/:4243 on the loopback the simulator
  # shares and the embedded one could not bind.
  #
  # Its job is to REACH the AI step on iOS and keep what happened there: if the
  # app aborts, `kotlin_crash.log` (PR #200 writes it before anything else) is
  # the deliverable, collected under always() with the app's own logs.
  ios-ai:
    name: ios simulator, with AI
    needs: [server]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_ai && (inputs.platforms == 'all' || contains(inputs.platforms, 'ios')) }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the iOS simulator app (the run's agent, embedded)
        id: ios
        uses: ./.github/actions/ios-sim-app
        with:
          agent-ref: ${{ needs.server.outputs.agent_tag }}
          run-server-version: ${{ needs.server.outputs.version }}

      - name: iOS simulator, with AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 -m testing.gate.run_platform --platform ios --app "${{ steps.ios.outputs.app }}" --udid "${{ steps.ios.outputs.udid }}" \
            --with-ai --agent-version "${{ needs.server.outputs.agent_pypi }}" \
            --llm-provider anthropic --llm-model "${{ inputs.llm_model }}" --llm-key-env ANTHROPIC_API_KEY \
            --node-version "v${{ needs.server.outputs.agent_server }}" \
            --embedded-node-version "${{ steps.ios.outputs.embedded }}" \
            --shots shots --report reports/ios-ai.json --flows testing/flows/agent ${{ inputs.candidate_version && format('--client-version {0}', inputs.candidate_version) || '' }}

      # #50'S RECORD AND THE APP'S OWN ACCOUNT, WHATEVER HAPPENED ABOVE. Logs
      # only: `*.log*` and `*.txt` from Documents/ciris, never the container
      # itself — the agent's .env in there holds the key by design.
      - name: Collect the iOS app's logs and crash record (kotlin_crash.log, CIRISClient#50)
        if: always()
        run: |
          set +e
          out=ios-ai-logs; mkdir -p "$out"
          udid="${IOS_UDID:-booted}"
          xcrun simctl spawn "$udid" log show --last 30m --style syslog \
            --predicate 'process == "iosApp" OR subsystem CONTAINS "ai.ciris.mobile"' > "$out/oslog.txt" 2>&1
          echo "oslog: $(wc -l < "$out/oslog.txt") lines"
          mkdir -p "$out/diagnostic-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name "iosApp*" -type f -exec cp {} "$out/diagnostic-reports/" \; 2>/dev/null
          echo "crash reports: $(ls "$out/diagnostic-reports" | wc -l)"
          box=$(xcrun simctl get_app_container "$udid" ai.ciris.mobile data 2>/dev/null)
          if [ -n "$box" ] && [ -d "$box/Documents" ]; then
            find "$box/Documents" -maxdepth 1 -name "*.log" -exec cp {} "$out/" \;
            [ -d "$box/Documents/ciris" ] && find "$box/Documents/ciris" \( -name "*.log*" -o -name "*.txt" \) -type f -exec cp {} "$out/" \;
            echo "app logs: $(ls "$out" | wc -l) file(s)"
          else
            echo "no Documents in ${box:-<no data container for ai.ciris.mobile on $udid>} — the app had not started writing"
          fi
          f="$box/Documents/ciris/logs/kotlin_crash.log"
          if [ -n "$box" ] && [ -f "$f" ]; then
            cp "$f" "$out/kotlin_crash.log"
            echo "::warning::the iOS app wrote a crash record ($(wc -l < "$f") lines) — $out/kotlin_crash.log"
            cat "$f"
          else
            echo "no kotlin_crash.log in ${box:-<no data container>}/Documents/ciris/logs — the app recorded no crash"
          fi
          for g in "$out/kmp_app.log" "$out/python_error.log"; do
            [ -f "$g" ] && { echo "--- $g (last 40 lines) ---"; tail -40 "$g"; }
          done
          exit 0

      # BEFORE THE UPLOAD, EVERY TIME (testing/gate/secret_scan.py): a file
      # holding the key is overwritten and the leg fails.
      - name: No artifact carries the provider key
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -m testing.gate.secret_scan --env ANTHROPIC_API_KEY \
            shots reports ios-ai-logs $(ls *-app.log 2>/dev/null)

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-ios-ai
          path: |
            shots/
            reports/
            *-app.log
            ios-ai-logs/
            ios-ai-logs/kotlin_crash.log

  gallery:
    name: screenshot gallery
    # ALWAYS, and needs all three: the RED run is the one worth looking at, and
    # a gallery that only builds on success is a gallery you can never use to
    # diagnose anything.
    if: always()
    needs: [server, linux-android, macos-ios, windows, linux-ai, windows-ai, ios-ai]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: live-qa-*
          merge-multiple: true
          path: collected
      - name: Build the gallery
        run: |
          python3 -m testing.gate.build_qa_gallery collected --out gallery.html --summary "$GITHUB_STEP_SUMMARY" --server-version "${{ needs.server.outputs.version }}" --server-source "${{ needs.server.outputs.source }}" || \
            echo "::warning::gallery build failed; the raw artifacts are still attached"
          # The ratchet over every leg at once, for the reader: the legs
          # already judged themselves (run_platform's optional-skips step).
          python3 -m testing.gate.optional_skips collected || true
      - uses: actions/upload-artifact@v4
        with:
          name: live-qa-gallery
          path: gallery.html
