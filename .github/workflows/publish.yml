# Publish ciris-client to PyPI via Trusted Publishing (OIDC).
#
# PyPI-side configuration — one pending publisher naming THIS file and THIS
# environment:
#
#   owner: CIRISAI   repo: CIRISClient
#   workflow: publish.yml            environment: pypi
#   project: ciris-client
#
# No API tokens: `id-token: write` mints a short-lived OIDC credential per run,
# which is why the job needs no secret and why a fork can never publish.
#
# ONE ARTIFACT PER WHEEL. PyPI's limit is per FILE, so the question is never
# "does the release fit" but "should this consumer download this payload".
#
#   ciris-client        one wheel per OS, carrying that OS's desktop uber-jar
#                       (~67 MiB raw, 63% of the limit). compose.desktop.currentOs
#                       means the jar is per-platform, so the wheel is retagged
#                       (manylinux/macosx/win) and pip picks the right one.
#   ciris-client-wasm   the browser bundle, py3-none-any, 6.8 MiB. Host-
#                       independent, and its consumers — CIRISHome on Home
#                       Assistant, and the agent replacing its legacy web
#                       interfaces — run no JVM. Bundling it with the desktop
#                       jar would make every web deployment download 67 MiB of
#                       JVM bytecode it never executes.
#
# The Android AAR and the iOS XCFramework are NOT wheels: their consumers are
# Gradle and Xcode, not pip. They are attached to the GitHub release.
#
# The `py3-none-any` wheel from the first 0.5.186 upload stays as the
# last-resort fallback: on a platform with no specific wheel it installs and
# then REFUSES with the remedy, rather than handing over a jar that cannot
# start.
#
# Additional platform wheels may be added to an EXISTING release, which is why
# the OS suite can complete 0.5.186 with no version bump. That matters beyond
# convenience: CLIENT_VERSION is generated from VERSION and drives the
# node-vs-client mismatch banner, so publishing 0.5.187 with no matching
# ciris-server release would show every user an "update recommended" banner
# that is not true. `skip-existing` passes over a file already uploaded instead
# of failing the run.
#
# WHAT MAY BE PUBLISHED. A placeholder payload must never reach PyPI — a wheel
# that installs and then refuses every artifact lookup is worse than no wheel,
# because `pip install ciris-client` would appear to succeed. The gate below
# reads the staged manifest and REFUSES before anything is uploaded.
#
# Trigger: a tag `v*`, or manual dispatch. Dispatch defaults to `none` — build
# and verify every wheel, upload them as run artifacts, publish NOTHING —
# because the one workflow whose failure mode is a half-done release should be
# rehearsable without a TestPyPI project having to exist.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "where to publish (none = build and verify only)"
        default: none
        type: choice
        options: [none, testpypi, pypi]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never interrupt an upload

jobs:
  build:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false # one OS failing must not hide the others' results
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux-x86_64
            wheel_tag: manylinux_2_17_x86_64
          - name: macos-arm64
            runner: macos-14
            platform: darwin-arm64
            wheel_tag: macosx_11_0_arm64
          - name: macos-x86_64
            # macos-13 was RETIRED in December 2025; a job asking for it queues
            # forever rather than failing, which is how this was found — three
            # legs green and one pending with no runner. macos-15-intel is the
            # Intel replacement. Horizon worth knowing: GitHub drops x86_64
            # macOS altogether when the macOS 15 image retires (Fall 2027), at
            # which point this leg becomes a cross-build or goes away.
            runner: macos-15-intel
            platform: darwin-x86_64
            wheel_tag: macosx_10_9_x86_64
          - name: windows-x86_64
            runner: windows-latest
            platform: windows-x86_64
            wheel_tag: win_amd64
    steps:
      - uses: actions/checkout@v4

      - name: apt (hardened)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt
        with:
          # The Compose desktop distribution tasks shell out to these.
          packages: zip unzip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # shared/ pins JvmTarget.JVM_17 on every target

      - uses: android-actions/setup-android@v3
        # :shared applies com.android.library, so the Android SDK is needed to
        # CONFIGURE the build even though only the desktop target is compiled.

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - run: python3 -m pip install --upgrade pip build wheel

      # The release gates, re-run here rather than trusted from the branch: a
      # tag can point at any commit. Linux only — they are OS-independent, and
      # running them four times says nothing new.
      - name: The server release this client pairs with
        id: pair
        if: matrix.name == 'linux-x86_64'
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Emitter sources (the ids the bundles must define)
        if: matrix.name == 'linux-x86_64'
        # The localization bundles live here; the Rust that EMITS ids into them
        # lives in CIRISServer. Five of the twelve checks compare the two, so
        # the guard is handed a checkout instead of being allowed to declare
        # the absence — a check with a denominator of zero is not a pass.
        #
        # Pinned to the VERSION this client pairs with, so the emitters graded
        # are the ones from that server release rather than whatever main holds.
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISServer
          ref: v${{ steps.pair.outputs.version }}
          path: .emitters

      - name: Gates
        if: matrix.name == 'linux-x86_64'
        run: |
          set -euo pipefail
          python3 packaging/check_vendoring.py
          python3 compat/validate.py
          python3 client/tools/check_localization_sync.py --self-test --server-src .emitters
          python3 client/tools/check_localization_sync.py --server-src .emitters --strict

      - name: The tag must name the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(cat VERSION)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
          echo "publishing $version"

      - name: Desktop uber-jar for this OS
        # compose.desktop.currentOs means the jar this produces carries THIS
        # runner's desktop runtime — the entire reason for the matrix. The agent
        # build is what ships: every surface present, narrowed at runtime by the
        # probed node.
        working-directory: client
        shell: bash
        run: ./gradlew --no-daemon -PhasAgent=true :desktopApp:packageUberJarForCurrentOS

      - name: Stage the jar, stamped with the platform it was built for
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find client/desktopApp/build/compose/jars -name '*.jar' | head -1)
          test -n "$jar" || { echo "::error::gradle produced no desktop jar"; exit 1; }
          python3 packaging/stage_artifacts.py --dist client \
            --artifact "desktop-uber-jar@${{ matrix.platform }}=$jar"

      - name: A placeholder must never be published
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          m = json.load(open("ciris_client/_artifacts/manifest.json"))
          if m.get("placeholder"):
              raise SystemExit(
                  f"::error::this build is a PLACEHOLDER "
                  f"({m.get('placeholder_reason')}) — refusing to publish a wheel "
                  f"that installs and then refuses every lookup"
              )
          kinds = [a["kind"] for a in m["artifacts"]]
          if not kinds:
              raise SystemExit("::error::the staged build carries no artifacts")
          print("staged:", ", ".join(kinds))
          PY

      - name: Build the wheel and tag it for this platform
        shell: bash
        run: |
          set -euo pipefail
          python3 -m build --wheel --outdir dist .
          # setuptools cannot know this is platform-specific — the payload is a
          # jar, not a compiled extension — so the tag is applied after the
          # fact. pip then prefers it over the `any` fallback on a machine it
          # matches.
          python3 -m wheel tags --platform-tag "${{ matrix.wheel_tag }}" --remove \
            dist/ciris_client-*-py3-none-any.whl
          ls -la dist

      - name: Wheel size against PyPI's limit
        shell: bash
        run: python3 packaging/check_wheel_size.py dist/*.whl

      - name: Consumption contract — install and resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv consumer-venv
          if [ -d consumer-venv/Scripts ]; then PY=$PWD/consumer-venv/Scripts/python; else PY=$PWD/consumer-venv/bin/python; fi
          "$PY" -m pip install --quiet --no-index dist/*.whl
          # Run from a directory that is NOT the checkout, so the INSTALLED
          # package answers rather than the source tree sitting beside it.
          mkdir -p verify && cd verify && "$PY" - <<'PY'
          import ciris_client as c
          m = c.manifest()
          assert not m.get("placeholder"), "placeholder reached the publish path"
          assert m["client_version"] == c.__version__, "version split"

          # Every artifact this wheel claims must actually resolve. A manifest
          # that lists what the build meant to produce is not evidence.
          for a in c.artifacts():
              p = c.artifact_path(a["kind"])
              assert p.exists(), f"{a['kind']} listed but missing at {p}"
              print(f"  {a['kind']:<18} {p.name}  {a['bytes']:,} bytes")

          kinds = {a["kind"] for a in c.artifacts()}
          assert kinds == {"desktop-uber-jar"}, f"expected the jar alone, got {kinds}"

          # The web bundle is a separate distribution. Asking for it here must
          # say so, not fail obscurely.
          try:
              c.artifact_path("wasm-browser")
          except c.ArtifactUnavailable as e:
              assert "own distribution" in str(e), e
              print("  wasm-browser correctly points at ciris-client-wasm")
          else:
              raise SystemExit("wasm resolved from the desktop wheel")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          retention-days: 14

  wasm:
    name: wheel (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        # :shared applies com.android.library, so the SDK is needed to CONFIGURE
        # even for the wasm target.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: python3 -m pip install --upgrade pip build

      - name: The web bundle
        # PRODUCTION (28 MiB), not developmentExecutable (69 MiB). Every visitor
        # downloads this; see shared/build.gradle.kts for why the old "never
        # ship production wasm" warning no longer holds — it was retested.
        working-directory: client
        run: ./gradlew --no-daemon -PhasAgent=true :shared:wasmJsBrowserDistribution

      - name: Stage it
        run: |
          set -euo pipefail
          wasm=client/shared/build/dist/wasmJs/productionExecutable
          test -d "$wasm" || { echo "::error::no wasm distribution at $wasm"; exit 1; }
          # Source maps are a debugging aid, not a shipped artifact — and the
          # largest thing in the bundle no visitor needs.
          rm -f "$wasm"/*.map
          python3 packaging/stage_artifacts.py --dist wasm --artifact "wasm-browser=$wasm"

      - name: Build the wheel
        run: python3 -m build --wheel --outdir dist packaging/wasm

      - run: python3 packaging/check_wheel_size.py dist/*.whl

      - name: Consumption contract — install and serve-check
        run: |
          set -euo pipefail
          python3 -m venv consumer-venv
          consumer-venv/bin/pip install --quiet --no-index dist/*.whl
          mkdir -p verify && cd verify && ../consumer-venv/bin/python - <<'PY'
          import ciris_client_wasm as w
          p = w.bundle_path()   # raises unless every required part is present
          print("serves:", p)
          print("index :", w.index_html().is_file())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wasm
          path: dist/*.whl
          retention-days: 14

  mobile:
    name: ${{ matrix.name }}
    # Android and iOS are NOT wheels: their consumers are Gradle and Xcode, not
    # pip. They are attached to the GitHub release instead.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false # iOS taking hours must not cancel the Android artifact
      matrix:
        include:
          - name: android-aar
            runner: ubuntu-latest
            task: ":shared:assembleRelease"
            timeout: 45
            cache_read_only: true
          - name: ios-xcframework
            # Kotlin/Native cannot cross-compile Apple targets, and release
            # linking is the expensive part: MEASURED at >85 minutes for
            # linkReleaseFrameworkIosArm64 alone — the first of three targets —
            # which is how a 90-minute budget produced a cancelled job rather
            # than a failed one. Compose + full LLVM optimization + isStatic is
            # the combination; the timeout below is sized for all three targets
            # on a COLD cache, and cache_read_only is false precisely so the
            # first run pays that once and later runs do not.
            runner: macos-14
            task: ":shared:assembleSharedReleaseXCFramework"
            timeout: 350
            cache_read_only: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ matrix.cache_read_only }}

      - name: Build
        working-directory: client
        run: ./gradlew --no-daemon -PhasAgent=true ${{ matrix.task }}

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile
          version=$(cat VERSION)
          if [ "${{ matrix.name }}" = "android-aar" ]; then
            src=client/shared/build/outputs/aar/shared-release.aar
            test -f "$src" || { echo "::error::no AAR at $src"; exit 1; }
            cp "$src" "mobile/ciris-client-$version.aar"
          else
            xcf=$(find client/shared/build/XCFrameworks/release -maxdepth 1 -name '*.xcframework' | head -1)
            test -n "$xcf" || { echo "::error::no XCFramework produced"; exit 1; }
            # Zipped because an .xcframework is a directory, and a release asset
            # is a file.
            (cd "$(dirname "$xcf")" && zip -qr - "$(basename "$xcf")") \
              > "mobile/ciris-client-$version.xcframework.zip"
          fi
          ls -la mobile

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.name }}
          path: mobile/*
          retention-days: 14

  release-assets:
    name: attach Android + iOS to the release
    needs: mobile
    # `always()`: the legs are independent artifacts, and iOS can take hours or
    # time out. Withholding the Android AAR because iOS was slow would be the
    # matrix's convenience beating the consumer's.
    if: |
      always() &&
      (github.event_name == 'push' || github.event.inputs.target != 'none')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create/update the release these attach to
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-*
          merge-multiple: true
          path: mobile
      - name: What built
        run: ls -la mobile || echo "no mobile artifacts this run"
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # On a tag push the tag is the release. On a dispatch (completing an
          # existing release's asset set) it comes from VERSION, which the tag
          # had to match to publish in the first place.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(cat VERSION)"
          fi
          shopt -s nullglob
          assets=(mobile/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::warning::no mobile artifacts to attach — check the mobile jobs"
            exit 0
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --title "$tag" --generate-notes
          gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "attached: ${assets[*]}"

  publish:
    name: publish to ${{ github.event.inputs.target || 'pypi' }}
    needs: [build, wasm]
    # A dispatch with target `none` is a rehearsal: every wheel is built and
    # verified above, and nothing is uploaded.
    if: github.event_name == 'push' || github.event.inputs.target != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment PyPI's trusted publisher is scoped to. Add required
    # reviewers on it to make publication a human decision.
    environment:
      name: ${{ github.event.inputs.target || 'pypi' }}
      url: https://pypi.org/project/ciris-client/
    permissions:
      id-token: write # OIDC — this is the credential; there is no token secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: What is about to be uploaded
        run: ls -la dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # Completing an OS suite on an existing release means some files may
          # already be there. Skipping them is correct; failing the run is not.
          skip-existing: true
          print-hash: true
