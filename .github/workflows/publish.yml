# Publish ciris-client to PyPI via Trusted Publishing (OIDC).
#
# PyPI-side configuration — one pending publisher naming THIS file and THIS
# environment:
#
#   owner: CIRISAI   repo: CIRISClient
#   workflow: publish.yml            environment: pypi
#   project: ciris-client
#
# No API tokens: `id-token: write` mints a short-lived OIDC credential per run,
# which is why the job needs no secret and why a fork can never publish.
#
# ONE ARTIFACT PER WHEEL. PyPI's limit is per FILE, so the question is never
# "does the release fit" but "should this consumer download this payload".
#
#   ciris-client        one wheel per OS, carrying that OS's desktop uber-jar
#                       (~67 MiB raw, 63% of the limit). compose.desktop.currentOs
#                       means the jar is per-platform, so the wheel is retagged
#                       (manylinux/macosx/win) and pip picks the right one.
#   ciris-client-wasm   the browser bundle, py3-none-any, 6.8 MiB. Host-
#                       independent, and its consumers — CIRISHome on Home
#                       Assistant, and the agent replacing its legacy web
#                       interfaces — run no JVM. Bundling it with the desktop
#                       jar would make every web deployment download 67 MiB of
#                       JVM bytecode it never executes.
#
# The Android AAR and the iOS XCFramework are NOT wheels: their consumers are
# Gradle and Xcode, not pip. They are attached to the GitHub release.
#
# The `py3-none-any` wheel from the first 0.5.186 upload stays as the
# last-resort fallback: on a platform with no specific wheel it installs and
# then REFUSES with the remedy, rather than handing over a jar that cannot
# start.
#
# Additional platform wheels may be added to an EXISTING release, which is why
# the OS suite can complete 0.5.186 with no version bump. That matters beyond
# convenience: CLIENT_VERSION is generated from VERSION and drives the
# node-vs-client mismatch banner, so publishing 0.5.187 with no matching
# ciris-server release would show every user an "update recommended" banner
# that is not true. `skip-existing` passes over a file already uploaded instead
# of failing the run.
#
# WHAT MAY BE PUBLISHED. A placeholder payload must never reach PyPI — a wheel
# that installs and then refuses every artifact lookup is worse than no wheel,
# because `pip install ciris-client` would appear to succeed. The gate below
# reads the staged manifest and REFUSES before anything is uploaded.
#
# Trigger: a tag `v*`, or manual dispatch. Dispatch defaults to `none` — build
# and verify every wheel, upload them as run artifacts, publish NOTHING —
# because the one workflow whose failure mode is a half-done release should be
# rehearsable without a TestPyPI project having to exist.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "where to publish (none = build and verify only)"
        default: none
        type: choice
        options: [none, testpypi, pypi]

# NO WORKFLOW-LEVEL CONCURRENCY. "Never interrupt an upload" is a rule about the
# UPLOAD, and putting it on the whole run made it a rule about the slowest job
# instead: ios-xcframework legitimately takes ~4 hours, so a second publish on
# the same ref queued behind it — and the release that FIXED Android's
# resolution (CIRISServer#493) sat waiting on an iOS artifact Android does not
# get from PyPI. The groups are now on the jobs that actually need them.

jobs:
  build:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false # one OS failing must not hide the others' results
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux-x86_64
            wheel_tag: manylinux_2_17_x86_64
          - name: macos-arm64
            runner: macos-14
            platform: darwin-arm64
            wheel_tag: macosx_11_0_arm64
          - name: macos-x86_64
            # macos-13 was RETIRED in December 2025; a job asking for it queues
            # forever rather than failing, which is how this was found — three
            # legs green and one pending with no runner. macos-15-intel is the
            # Intel replacement. Horizon worth knowing: GitHub drops x86_64
            # macOS altogether when the macOS 15 image retires (Fall 2027), at
            # which point this leg becomes a cross-build or goes away.
            runner: macos-15-intel
            platform: darwin-x86_64
            wheel_tag: macosx_10_9_x86_64
          - name: windows-x86_64
            runner: windows-latest
            platform: windows-x86_64
            wheel_tag: win_amd64
    steps:
      - uses: actions/checkout@v4

      - name: apt (hardened)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt
        with:
          # The Compose desktop distribution tasks shell out to these.
          packages: zip unzip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # shared/ pins JvmTarget.JVM_17 on every target

      - uses: android-actions/setup-android@v3
        # :shared applies com.android.library, so the Android SDK is needed to
        # CONFIGURE the build even though only the desktop target is compiled.

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - run: python3 -m pip install --upgrade pip build wheel

      # The release gates, re-run here rather than trusted from the branch: a
      # tag can point at any commit. Linux only — they are OS-independent, and
      # running them four times says nothing new.
      - name: The CIRISServer commit this tree was merged against
        id: pair
        if: matrix.name == 'linux-x86_64'
        # NOT `v$(cat VERSION)`. That pin assumed the client's version trails the
        # server's releases, and the client LEADS by design: 0.5.189 exists here
        # so CIRISServer 0.5.189 can pin a client that has the feature. The tag
        # did not exist, and every workflow failed at checkout.
        #
        # VENDORING.md §1 already records the commit the tree was actually merged
        # against, which is the emitter set the bundle was reconciled with — and
        # it cannot fail to exist, because merging it is what wrote the row.
        run: echo "ref=$(python3 packaging/check_vendoring.py --merged-ref CIRISServer)" >> "$GITHUB_OUTPUT"

      - name: Emitter sources (the ids the bundles must define)
        if: matrix.name == 'linux-x86_64'
        # The localization bundles live here; the Rust that EMITS ids into them
        # lives in CIRISServer. Five of the twelve checks compare the two, so
        # the guard is handed a checkout instead of being allowed to declare
        # the absence — a check with a denominator of zero is not a pass.
        #
        # Pinned to the merged state in VENDORING.md §1, so the emitters graded
        # are the ones this tree was reconciled against rather than whatever main
        # holds — and the pin moves only when a §8 pull moves it.
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISServer
          ref: ${{ steps.pair.outputs.ref }}
          path: .emitters

      - name: Gates
        if: matrix.name == 'linux-x86_64'
        run: |
          set -euo pipefail
          python3 packaging/check_vendoring.py
          python3 compat/validate.py
          python3 packaging/check_pins.py
          python3 client/tools/check_localization_sync.py --self-test --server-src .emitters
          python3 client/tools/check_localization_sync.py --server-src .emitters --strict

      - name: The tag must name the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(cat VERSION)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
          echo "publishing $version"

      - name: Desktop uber-jar for this OS
        # compose.desktop.currentOs means the jar this produces carries THIS
        # runner's desktop runtime — the entire reason for the matrix. The agent
        # build is what ships: every surface present, narrowed at runtime by the
        # probed node.
        working-directory: client
        shell: bash
        run: ./gradlew --no-daemon :desktopApp:packageUberJarForCurrentOS

      - name: Stage the jar, stamped with the platform it was built for
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find client/desktopApp/build/compose/jars -name '*.jar' | head -1)
          test -n "$jar" || { echo "::error::gradle produced no desktop jar"; exit 1; }
          python3 packaging/stage_artifacts.py --dist client \
            --artifact "desktop-uber-jar@${{ matrix.platform }}=$jar"

      - name: A placeholder must never be published
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          m = json.load(open("ciris_client/_artifacts/manifest.json"))
          if m.get("placeholder"):
              raise SystemExit(
                  f"::error::this build is a PLACEHOLDER "
                  f"({m.get('placeholder_reason')}) — refusing to publish a wheel "
                  f"that installs and then refuses every lookup"
              )
          kinds = [a["kind"] for a in m["artifacts"]]
          if not kinds:
              raise SystemExit("::error::the staged build carries no artifacts")
          print("staged:", ", ".join(kinds))
          PY

      - name: Build the wheel and tag it for this platform
        shell: bash
        run: |
          set -euo pipefail
          # CLEAN FIRST. setuptools caches the staged payload in build/lib, and
          # a rebuild after a DIFFERENT staging re-adds whatever was there
          # before: a universal build produced a 66 MiB wheel carrying
          # CIRIS-linux-x64-1.5.188.jar — two versions stale, from a payload the
          # staging had already deleted. The size check passes, because the jar
          # is a plausible size for a wheel that is supposed to have one.
          rm -rf build dist
          python3 -m build --wheel --outdir dist .
          # setuptools cannot know this is platform-specific — the payload is a
          # jar, not a compiled extension — so the tag is applied after the
          # fact. pip then prefers it over the `any` fallback on a machine it
          # matches.
          python3 -m wheel tags --platform-tag "${{ matrix.wheel_tag }}" --remove \
            dist/ciris_client-*-py3-none-any.whl
          ls -la dist

      - name: Wheel size against PyPI's limit
        shell: bash
        run: python3 packaging/check_wheel_size.py dist/*.whl

      - name: Consumption contract — install and resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv consumer-venv
          if [ -d consumer-venv/Scripts ]; then PY=$PWD/consumer-venv/Scripts/python; else PY=$PWD/consumer-venv/bin/python; fi
          "$PY" -m pip install --quiet --no-index dist/*.whl
          # Run from a directory that is NOT the checkout, so the INSTALLED
          # package answers rather than the source tree sitting beside it.
          mkdir -p verify && cd verify && "$PY" - <<'PY'
          import ciris_client as c
          # Prove the cd worked rather than trusting it: `python -` puts CWD
          # first on sys.path, and a comment cannot fail.
          assert "site-packages" in c.__file__, f"resolved the source tree: {c.__file__}"
          m = c.manifest()
          assert not m.get("placeholder"), "placeholder reached the publish path"
          assert m["client_version"] == c.__version__, "version split"

          # Every artifact this wheel claims must actually resolve. A manifest
          # that lists what the build meant to produce is not evidence.
          for a in c.artifacts():
              p = c.artifact_path(a["kind"])
              assert p.exists(), f"{a['kind']} listed but missing at {p}"
              print(f"  {a['kind']:<18} {p.name}  {a['bytes']:,} bytes")

          kinds = {a["kind"] for a in c.artifacts()}
          assert kinds == {"desktop-uber-jar"}, f"expected the jar alone, got {kinds}"

          # The web bundle is a separate distribution. Asking for it here must
          # say so, not fail obscurely.
          try:
              c.artifact_path("wasm-browser")
          except c.ArtifactUnavailable as e:
              assert "own distribution" in str(e), e
              print("  wasm-browser correctly points at ciris-client-wasm")
          else:
              raise SystemExit("wasm resolved from the desktop wheel")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          retention-days: 14

  # ── The wheel every NON-DESKTOP consumer resolves ───────────────────────────
  universal:
    name: wheel (universal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip build

      - name: Stage the locale bundle, and no OS payload
        # pip resolves on the WHEEL TAG. The four OS-tagged wheels match nothing
        # on Android, iOS, or any platform outside that set, so a release
        # without py3-none-any is UNRESOLVABLE there — and the resolver names
        # the last version that had one, which reads like a yank rather than a
        # missing tag (CIRISServer#493).
        #
        # It carries the locale bundle rather than nothing: a wheel that only
        # installs is not worth publishing, and the bundle is what makes
        # server-emitted ids resolve — the thing a jar-free consumer needs.
        # Android and iOS take the AAR and XCFramework from the GitHub release;
        # this wheel is for the Python side.
        run: python3 packaging/stage_artifacts.py --universal

      - name: Build it, and DO NOT retag
        run: |
          set -euo pipefail
          rm -rf build dist
          python3 -m build --wheel --outdir dist .
          ls -la dist
          case "$(ls dist)" in
            *py3-none-any.whl) ;;
            *) echo "::error::the universal job produced something that is not py3-none-any"; exit 1 ;;
          esac

      - name: It must NOT carry a jar
        # The size is the tell, and it is checked rather than eyeballed: ~63 MiB
        # means a desktop runtime rode along in setuptools' build cache, and
        # nothing downstream would notice — the wheel installs, and the size
        # check passes because that IS a plausible size for a client wheel.
        run: |
          set -euo pipefail
          python3 packaging/check_wheel_size.py dist/*.whl
          if python3 -c "
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          jars = [i.filename for i in z.infolist() if i.filename.endswith('.jar')]
          sys.exit(0 if jars else 1)
          " dist/*.whl; then
            echo "::error::the universal wheel carries a jar — clean build/ before packaging"
            exit 1
          fi

      - name: Consumption contract — locales without a jar
        run: |
          set -euo pipefail
          python3 -m venv consumer-venv
          consumer-venv/bin/pip install --quiet --no-index dist/*.whl
          mkdir -p verify && cd verify && ../consumer-venv/bin/python - <<'PY'
          import ciris_client as c
          assert "site-packages" in c.__file__, f"resolved the source tree: {c.__file__}"
          m = c.manifest()
          assert m.get("universal"), "the universal wheel does not declare itself universal"
          assert not m.get("placeholder"), "universal is not a placeholder"
          b = c.locale_bundle()
          n = len([p for p in b.glob("*.json") if p.name != "manifest.json"])
          assert n == 29, f"expected 29 locales without a jar, got {n}"
          print(f"  locale_bundle(): {n} locales, no jar, no extraction")
          # And the refusal must say WHICH wheel this is, not just what it lacks.
          try:
              c.artifact_path("desktop-uber-jar")
          except c.ArtifactUnavailable as e:
              assert "by design, not by failure" in str(e), str(e)
              print("  artifact_path refuses as a supported state, not a bug")
          else:
              raise SystemExit("the universal wheel handed back a desktop jar")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-universal
          path: dist/*.whl
          retention-days: 14

  wasm:
    name: wheel (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        # :shared applies com.android.library, so the SDK is needed to CONFIGURE
        # even for the wasm target.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: python3 -m pip install --upgrade pip build

      - name: The web bundle
        # PRODUCTION (28 MiB), not developmentExecutable (69 MiB). Every visitor
        # downloads this; see shared/build.gradle.kts for why the old "never
        # ship production wasm" warning no longer holds — it was retested.
        working-directory: client
        run: ./gradlew --no-daemon :shared:wasmJsBrowserDistribution

      - name: Stage it
        run: |
          set -euo pipefail
          wasm=client/shared/build/dist/wasmJs/productionExecutable
          test -d "$wasm" || { echo "::error::no wasm distribution at $wasm"; exit 1; }
          # Source maps are a debugging aid, not a shipped artifact — and the
          # largest thing in the bundle no visitor needs.
          rm -f "$wasm"/*.map
          python3 packaging/stage_artifacts.py --dist wasm --artifact "wasm-browser=$wasm"

      - name: Build the wheel
        run: python3 -m build --wheel --outdir dist packaging/wasm

      - run: python3 packaging/check_wheel_size.py dist/*.whl

      - name: Consumption contract — install and serve-check
        run: |
          set -euo pipefail
          python3 -m venv consumer-venv
          consumer-venv/bin/pip install --quiet --no-index dist/*.whl
          mkdir -p verify && cd verify && ../consumer-venv/bin/python - <<'PY'
          import ciris_client_wasm as w
          p = w.bundle_path()   # raises unless every required part is present
          print("serves:", p)
          print("index :", w.index_html().is_file())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wasm
          path: dist/*.whl
          retention-days: 14

  mobile:
    name: ${{ matrix.name }}
    # Android and iOS are NOT wheels: their consumers are Gradle and Xcode, not
    # pip. They are attached to the GitHub release instead.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false # iOS taking hours must not cancel the Android artifact
      matrix:
        include:
          - name: android-aar
            runner: ubuntu-latest
            task: ":shared:assembleRelease"
            timeout: 45
            # Ten minutes of total silence from a Gradle build is a hang, not a
            # slow step: even the long Kotlin/Native links emit task lines.
            idle_seconds: 600
            cache_read_only: true
          - name: ios-xcframework
            # Kotlin/Native cannot cross-compile Apple targets, and release
            # linking is the expensive part: MEASURED at >85 minutes for
            # linkReleaseFrameworkIosArm64 alone — the first of three targets —
            # which is how a 90-minute budget produced a cancelled job rather
            # than a failed one. Compose + full LLVM optimization + isStatic is
            # the combination; the timeout below is sized for all three targets
            # on a COLD cache, and cache_read_only is false precisely so the
            # first run pays that once and later runs do not.
            runner: macos-14
            task: ":shared:assembleSharedReleaseXCFramework"
            # Two links, not three (iosX64 dropped — see shared/build.gradle.kts):
            # ~161 min measured, so 240 leaves real headroom on a cold runner
            # without the old 350 that let a wedged build burn six hours.
            timeout: 240
            # 25 minutes, not 10. linkReleaseFrameworkIosArm64 is measured at
            # 81 minutes and is genuinely quiet inside LLVM optimisation, so a
            # tighter idle window would kill a healthy build — which is the
            # failure mode a hang detector must not have. The wall clock stays
            # at 350; what changes is that a WEDGED build now fails in 25
            # minutes with thread stacks instead of at 350 with "cancelled".
            idle_seconds: 1500
            cache_read_only: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ matrix.cache_read_only }}

      - name: Kotlin/Native toolchain cache
        # setup-gradle caches ~/.gradle and NOT ~/.konan, which is where
        # Kotlin/Native keeps LLVM and the sysroots. So every run re-downloaded
        # them and printed "one-time action performed only on the first run of
        # the compiler" — every run being a first run. `cache_read_only: false`
        # was set on this job to stop exactly that and could never have worked,
        # because it governs a different cache.
        #
        # This is minutes, not hours. The hours are the release links, and the
        # step below is what stops paying those.
        if: matrix.name == 'ios-xcframework'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('client/gradle/libs.versions.toml', 'client/build.gradle.kts', 'client/shared/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: XCFramework cache
        # THE ACTUAL FIX. Four hours is three sequential release links —
        # iosArm64 81m, iosSimulatorArm64 80m, iosX64 83m — and everything else
        # in the job is seven minutes. Release linking is whole-program LLVM
        # optimisation over all of Compose Multiplatform; it is expensive
        # because of what it does, and Kotlin/Native does not use compiler
        # caches for optimised release binaries, so no toolchain cache shortens
        # it.
        #
        # What DOES shorten it is not doing it. The framework is a pure function
        # of the Kotlin that goes into it, and most releases do not touch that:
        # a locale pass, a packaging fix, a version bump all rebuild an
        # artifact that is byte-for-byte the previous one. Keyed on the sources
        # the framework is actually built from, a release that did not change
        # them restores in seconds.
        #
        # Deliberately NOT keyed on the vendoring digest: that covers all of
        # client/, so a locale JSON — which the framework does not embed
        # (composeResources is NO-SOURCE) — would invalidate hours of work for
        # nothing.
        #
        # VERSION *is* in the key and stays there. generateBuildFlavor compiles
        # CLIENT_VERSION into commonMain, so a new version genuinely is a
        # different framework, and a cache that ignored that would ship the
        # previous version's string into the VERSION-MISMATCH banner — the
        # exact defect CLIENT_VERSION generation exists to prevent. So this
        # cache pays off on RE-RUNS of a version (three re-tags of 0.5.190
        # today, four hours each) and not on new ones; what makes new ones
        # cheaper is having two release links instead of three.
        id: xcf-cache
        if: matrix.name == 'ios-xcframework'
        uses: actions/cache@v4
        with:
          path: client/shared/build/XCFrameworks/release
          key: xcf-${{ runner.os }}-${{ hashFiles('client/shared/src/commonMain/**', 'client/shared/src/iosMain/**', 'client/shared/src/iosArm64Main/**', 'client/shared/src/iosSimulatorArm64Main/**', 'client/generated-api/src/**', 'client/shared/build.gradle.kts', 'client/generated-api/build.gradle.kts', 'client/build.gradle.kts', 'client/gradle.properties', 'VERSION') }}

      - name: Build
        # Skipped entirely on an XCFramework cache hit — the four hours are the
        # link, so the only way not to pay them is not to run it.
        if: matrix.name != 'ios-xcframework' || steps.xcf-cache.outputs.cache-hit != 'true'
        working-directory: client
        run: |
          ../packaging/run_with_watchdog.sh \
            "${{ matrix.idle_seconds }}" 300 "${{ matrix.name }}" \
            -- ./gradlew --no-daemon ${{ matrix.task }}

      - name: Restored, not rebuilt
        if: matrix.name == 'ios-xcframework' && steps.xcf-cache.outputs.cache-hit == 'true'
        run: |
          echo "XCFramework restored from cache — the Kotlin that feeds it is unchanged."
          find client/shared/build/XCFrameworks/release -maxdepth 1 -name '*.xcframework' -exec du -sh {} +

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile
          version=$(cat VERSION)
          if [ "${{ matrix.name }}" = "android-aar" ]; then
            src=client/shared/build/outputs/aar/shared-release.aar
            test -f "$src" || { echo "::error::no AAR at $src"; exit 1; }
            cp "$src" "mobile/ciris-client-$version.aar"
          else
            xcf=$(find client/shared/build/XCFrameworks/release -maxdepth 1 -name '*.xcframework' | head -1)
            test -n "$xcf" || { echo "::error::no XCFramework produced"; exit 1; }
            # Zipped because an .xcframework is a directory, and a release asset
            # is a file.
            (cd "$(dirname "$xcf")" && zip -qr - "$(basename "$xcf")") \
              > "mobile/ciris-client-$version.xcframework.zip"
          fi
          ls -la mobile

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.name }}
          path: mobile/*
          retention-days: 14

  release-assets:
    name: attach Android + iOS to the release
    concurrency:
      # It creates or updates one release; two at once would race on its assets.
      group: release-assets-${{ github.ref }}
      cancel-in-progress: false
    needs: mobile
    # `always()`: the legs are independent artifacts, and iOS can take hours or
    # time out. Withholding the Android AAR because iOS was slow would be the
    # matrix's convenience beating the consumer's.
    # A TAG PUSH ONLY. This used to accept any dispatch whose target was not
    # `none`, which meant a TestPyPI rehearsal from any ref ran this job — and
    # `gh release create` invents a tag from the default branch when none
    # exists, so a rehearsal could mint an OFFICIAL v$(cat VERSION) release
    # pointing at code that is not what was being tested. `always()` is kept
    # for the reason it was added: iOS can take hours or time out, and
    # withholding the Android AAR because iOS was slow is the matrix's
    # convenience beating the consumer's.
    if: always() && github.event_name == 'push' && github.ref_type == 'tag' 
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create/update the release these attach to
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-*
          merge-multiple: true
          path: mobile
      - name: What built
        run: ls -la mobile || echo "no mobile artifacts this run"
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # On a tag push the tag is the release. On a dispatch (completing an
          # existing release's asset set) it comes from VERSION, which the tag
          # had to match to publish in the first place.
          # The job only runs on a tag push now, so the tag IS the ref. Kept as
          # a check rather than an assumption: this is the step that can create
          # a release, and it must never invent the thing it is attaching to.
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || {
            echo "::error::release-assets ran without a tag ref"; exit 1; }
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          assets=(mobile/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::warning::no mobile artifacts to attach — check the mobile jobs"
            exit 0
          fi
          # --verify-tag: create a release for a tag that EXISTS, never one
          # `gh` would helpfully mint from the default branch.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
                 --title "$tag" --generate-notes
          gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "attached: ${assets[*]}"

  publish:
    name: publish to ${{ github.event.inputs.target || 'pypi' }}
    concurrency:
      # Two uploads of the same version at once is the thing to prevent.
      group: publish-upload-${{ github.event.inputs.target || 'pypi' }}
      cancel-in-progress: false
    needs: [build, wasm, universal]
    # A dispatch with target `none` is a rehearsal: every wheel is built and
    # verified above, and nothing is uploaded.
    if: github.event_name == 'push' || github.event.inputs.target != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment PyPI's trusted publisher is scoped to. Add required
    # reviewers on it to make publication a human decision.
    environment:
      name: ${{ github.event.inputs.target || 'pypi' }}
      url: https://pypi.org/project/ciris-client/
    permissions:
      id-token: write # OIDC — this is the credential; there is no token secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: What is about to be uploaded
        run: ls -la dist

      - name: Publish
        id: upload
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # Completing an OS suite on an existing release means some files may
          # already be there. Skipping them is correct; failing the run is not.
          skip-existing: true
          print-hash: true

      - name: The index must offer a wheel a non-desktop consumer can resolve
        # AFTER the upload, because that is when there is something to assert.
        # Fails closed on an unreachable index: "I could not ask" is not "it is
        # fine", and that equivalence is exactly what let py3-none-any go
        # missing for three releases while every check installed on a desktop
        # host and matched manylinux (CIRISServer#493).
        if: github.event_name == 'push' || github.event.inputs.target == 'pypi'
        run: |
          set -euo pipefail
          # PyPI's index is read-through-cache; give the upload a moment to
          # appear rather than failing a release on propagation.
          for i in 1 2 3 4 5; do
            if python3 packaging/check_universal_wheel.py; then exit 0; fi
            echo "not visible yet — retry $i/5"; sleep 20
          done
          python3 packaging/check_universal_wheel.py
