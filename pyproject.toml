[project]
name = "ciris-client"
dynamic = ["version"]
description = "The CIRIS Kotlin Multiplatform client — one build, consumed as a dependency"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }

# Deliberately empty. This distribution is the resolver and the version — the
# built client bundles arrive through the flavor extras below, so a consumer
# that only needs to ask "which client version pairs with this node?" does not
# download ~46 MiB of JVM bytecode to find out.
dependencies = []

[project.optional-dependencies]
# One flavor per extra, never both: they are the same client compiled with
# CIRISBuild.HAS_AGENT false and true. See README § The consumption contract.
#
# Pinned to this distribution's own version: `ciris-client[node]==X` must
# resolve the X payload, or pip pairs an old resolver with whatever payload
# published last and the split surfaces only at runtime. The pin equals VERSION;
# packaging/check_pins.py asserts that in CI, and a release bump touches both
# in the same commit.
node = ["ciris-client-node==0.5.185"]
agent = ["ciris-client-agent==0.5.185"]
# The build-readiness gates (this repo's original contents). Their framework
# lives in CIRISGrace and is not published yet, which is why it is an extra and
# not a dependency — `pip install ciris-client` must not fail on it.
readiness = ["ciris-grace"]

[project.scripts]
client-readiness = "readiness.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ciris_client", "readiness"]

[tool.setuptools.dynamic]
# The single source of the version, shared with the Kotlin build: the same file
# :shared:generateBuildFlavor stamps into CLIENT_VERSION. `ciris-client==X` and
# `ciris-server==X` are the pair.
version = { file = "VERSION" }

[tool.setuptools.package-data]
ciris_client = ["py.typed"]
