[project]
name = "ciris-client"
dynamic = ["version"]
description = "The CIRIS Kotlin Multiplatform client — one build, consumed as a dependency"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }

# Nothing at runtime: the client is JVM bytecode staged in by the build, and
# this package's job is to find it and say which node version it pairs with.
dependencies = []

[project.optional-dependencies]
# The browser bundle, in its own distribution: it is host-independent and its
# consumers run no JVM, so it is not carried by the per-OS desktop wheels.
# Pinned to this distribution's own version — `ciris-client[web]==X` must
# resolve the X bundle, or a stale resolver pairs with a fresh payload and the
# split surfaces only at runtime. packaging/check_pins.py asserts it in CI.
web = ["ciris-client-wasm==0.5.188"]

# The build-readiness gates (this repo's original contents). Their framework
# lives in CIRISGrace and is not published yet, which is why it is an extra and
# not a dependency — `pip install ciris-client` must not fail on it.
readiness = ["ciris-grace"]

[project.scripts]
client-readiness = "readiness.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ciris_client", "readiness"]

[tool.setuptools.dynamic]
# The single source of the version, shared with the Kotlin build: the same file
# :shared:generateBuildFlavor stamps into CLIENT_VERSION. `ciris-client==X` and
# `ciris-server==X` are the pair.
version = { file = "VERSION" }

[tool.setuptools.package-data]
# Everything staged by packaging/stage_artifacts.py. The bundles are
# .jar/.aar/.klib; naming them individually would mean editing this file every
# time the build graph grows a target.
ciris_client = ["py.typed", "_artifacts/*", "_artifacts/**/*"]
