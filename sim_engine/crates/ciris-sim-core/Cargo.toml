[package]
name = "ciris-sim-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CIRISAI/CIRISClient"
description = "Deterministic no_std physics core for the CIRIS relational object: measured couplings, resistance metric, parity sectors, Laplacian modes, and the proved twin dark-state probe. Replaces the ad-hoc force simulations in CIRISGame and CEWPOS."

[dependencies]
libm = "0.2"

[features]
default = []
std = []

# Benchmarks. The library is `no_std`; a bench target is a separate crate and may use
# `std` freely, so no feature gymnastics are needed and the `std` feature stays unused
# by them. `harness = false` because libtest's `#[bench]` is nightly-only and these are
# plain `fn main()` reports meant to be read, not regression-gated.
[[bench]]
name = "profile_reduction"
harness = false

[[bench]]
name = "step_cost"
harness = false
