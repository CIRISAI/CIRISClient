# A deployment probe, NOT part of the engine.
#
# `ciris-sim-core` is a library crate, so `cargo build --target wasm32-*` emits an
# `.rlib`, never a `.wasm`. An rlib byte count is not a wasm byte count (it is an `ar`
# archive of object code plus metadata), so reporting one as the deployment size would
# be false. This crate is the smallest honest way to get a real `.wasm`: a `cdylib` that
# links the engine, supplies the `#[panic_handler]` a `no_std` cdylib requires, and
# exports enough surface to keep the linker from discarding the engine as dead code.
#
# It adds no `std`, no `alloc` and no unsafe of its own. See sim_engine/PORTABILITY.md.
[package]
name = "ciris-sim-wasm-probe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# `rlib` only. A `cdylib` cannot be produced for the host here (a `no_std` cdylib needs
# a `#[panic_handler]`, which a std host build must not have), so the wasm `.wasm` is
# emitted with `cargo rustc --crate-type cdylib` per target instead. See PORTABILITY.md.
[lib]
crate-type = ["rlib"]

[dependencies]
ciris-sim-core = { path = "../ciris-sim-core" }
libm = "0.2.16"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
