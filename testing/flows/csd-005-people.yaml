csd: CSD-005
flow: csd_005_people
title: People lists who you may exchange messages with, and says so honestly when empty
description: >-
  CSD-005 §4, driven. Contacts IS the People tab in every circle, so the chain
  ends on the tab. The flow drives the four states the card declares and the one
  distinction the no-gating rule turns on: an EMPTY unsearched list shows the add
  card instead of the empty sentence, because that list has exactly one useful
  next move.
# Floor: every tag is a PeopleTags constant in ui/screens/PeopleSupport.kt:16-40
# at v0.5.224 (contacts_list, contacts_empty, contacts_error, contacts_loading,
# card_contacts_add, input_contacts_search, btn_contacts_*). `contacts_row_trust`
# is still proposed and is NOT asserted here.
client: ">=0.5.224"

steps:
  - step_id: on_people
    title: The People tab shows the search and one of its two empty shapes
    description: >-
      `one_of` rather than `visible`, because which of the two renders is the
      claim CSD-005 §2 makes and the fixture does not control: a node with
      contacts shows the list, a fresh node shows the add card. Asserting either
      one alone would make this flow depend on whose node it ran against.
    requires:
      screen: Contacts
    expect:
      visible: [input_contacts_search]
      absent: [contacts_loading]

  - step_id: an_empty_list_offers_the_move
    title: On a node with no contacts the add card replaces the empty sentence
    description: >-
      The `absent:` half is the whole point. CSD-005 §2 says the empty sentence is
      SUPPRESSED over an empty unsearched list, because "No contacts yet" next to
      a button that adds one is two ways of saying the same thing and the button
      is the useful one.
    optional_step: true
    requires:
      screen: Contacts
      visible: [card_contacts_add]
    expect:
      visible: [card_contacts_add, btn_contacts_add_open]
      absent: [contacts_empty]

  - step_id: a_populated_list
    title: On a node with contacts, the list renders rows
    description: >-
      Optional because it needs a peered node. `count: min 1` and not a `visible:`
      on the container: a list frame that rendered zero rows answers a `visible:`
      check correctly and is exactly the vacuous green this harness has produced
      three times.
    optional_step: true
    requires:
      screen: Contacts
      visible: [contacts_list]
    expect:
      state: populated
      count: {of: "contacts_row_*", min: 1}
      visible: [contacts_list]

  - step_id: search_that_matches_nothing
    title: A search with no match is EMPTY, and says so in words
    description: >-
      Here the empty sentence IS right, because a searched list has a second
      useful move — clear the search — and the sentence names the query. This is
      the state that must never look like the error state
      (PrimitiveRulesTest.errorNeverLooksLikeEmpty pins the tone, glyph and box).
    optional_step: true
    requires:
      screen: Contacts
      visible: [contacts_list]
    do:
      - input: {input_contacts_search: "zzzzz-no-such-contact"}
    expect:
      state: empty
      visible: [contacts_empty]
      count: {of: "contacts_row_*", eq: 0}

  - step_id: clearing_the_search_restores_the_list
    title: Clearing the search brings the rows back
    optional_step: true
    requires:
      screen: Contacts
      visible: [contacts_empty]
    do:
      - input: {input_contacts_search: ""}
    expect:
      visible: [contacts_list]
      absent: [contacts_empty]

  - step_id: a_node_too_old_refuses_by_name
    title: A node without contacts support says which version it is running
    description: >-
      The one "node fact" refusal the no-gating rule honours: `contacts_unsupported`
      names the running version and the version needed, rather than presenting an
      empty list for a feature the node does not have. Optional because it needs a
      node older than 0.5.185.
    optional_step: true
    requires:
      screen: Contacts
      visible: [contacts_unsupported]
    expect:
      state: error
      visible: [contacts_unsupported]
      absent: [contacts_empty]
