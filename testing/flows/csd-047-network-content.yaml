csd: CSD-047
flow: csd_047_network_content
title: Fetch one piece of content from one peer by its digest
description: >-
  CSD-047 §4, driven. GET /v1/federation/peers to pick a peer, then
  POST /v1/federation/content/{content_id} (CIRISServer src/federation_surface.rs:699,
  owner session, 64-hex digest) on the NODE url. The digest field and the fetch
  button had no tag and no input sink; they do now.
# Floor: screen_federation_content, input_peer_search, empty_content_peers,
# peer_pick_row_${peer.keyId}, input_content_id, btn_content_fetch,
# text_content_fetch_error, card_content_result
# (ui/screens/federation/NetworkContentScreen.kt); federation_content_peers_error /
# federation_content_peers_not_on_this_node (ReadFailureBlock).
client: ">=0.5.225"
# The peer to pick is the two-node fixture's peer NODE (testing/gate/two_node.py):
# GET /v1/federation/peers lists the nodes this node has admitted, and peering
# admits ${PEER_NODE_KEY_ID}.
fixture: two_node

steps:
  - step_id: on_content
    title: The hub's Content tile opens the pick step with a drivable search field
    description: >-
      NetworkContent has no nav hop — it is reached from a tile on the transport
      hub (LayerGlobalCommons), which does — so the flow starts on the hub and
      taps the tile, as CSD-047 §4 says.
    requires:
      screen: LayerGlobalCommons
    do:
      - click: tile_federation_content
      - wait: input_peer_search
        wait_ms: 5000
      - input: {input_peer_search: "zz-no-such-peer"}
    expect:
      screen: NetworkContent
      visible: [screen_federation_content, input_peer_search]

  - step_id: clearing_the_search_lists_the_peer
    title: Clearing the search lists the peer the fixture admitted
    description: >-
      Searched for by its key, as a person with a long list would. From
      ciris-server 0.5.218 a node discovers more peers, so the list holds more
      than the fixture's one and the picker is a lazy list: a row below the
      fold is not composed at all (iOS, run 36918401535: six other
      `ciris-client-*` rows, the fixture's peer seventh).
    do:
      - input: {input_peer_search: ""}
      - input: {input_peer_search: "${PEER_NODE_KEY_ID}"}
      - wait: "peer_pick_row_${PEER_NODE_KEY_ID}"
        wait_ms: 2500
    expect:
      screen: NetworkContent
      visible: [input_peer_search, "peer_pick_row_${PEER_NODE_KEY_ID}"]
      absent: [empty_content_peers]

  - step_id: picking_the_peer_opens_the_digest_step
    title: Picking the peer opens the digest step
    do:
      - click: "peer_pick_row_${PEER_NODE_KEY_ID}"
      - wait: input_content_id
        wait_ms: 2500
    expect:
      visible: [input_content_id, btn_content_fetch]

  - step_id: a_bad_digest_keeps_fetch_shut
    title: A digest that is not 64 hex characters cannot be fetched
    description: >-
      The node would refuse it (INVALID_CONTENT_ID, 400); the card refuses first.
      Asserting the button is present and the field took input is what a flow
      can do; the disabled state is the view model's validateContentId. A real
      fetch needs a digest the peer holds, which the fixture does not seed.
    requires:
      visible: [input_content_id]
    do:
      - input: {input_content_id: "not-a-digest"}
    expect:
      visible: [input_content_id, btn_content_fetch]
