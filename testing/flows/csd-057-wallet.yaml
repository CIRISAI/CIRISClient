csd: CSD-057
flow: csd_057_wallet
title: The wallet says it is experimental, names its limits and fees, and offers a form it never submits
description: >-
  CSD-057 §4, driven. Four agent routes are live and called
  (CIRISAgent routes/wallet.py:570/674/817/976, unchanged on main). The card is
  placed in Communities and Businesses > Rules with no `agentOnly`
  (CirclesNav.kt:119), so on a node build it answers from a synthesised value —
  which is why the experimental banner is asserted before any number is.
# Floor: card_wallet_experimental, card_wallet_balance, card_wallet_limits,
# card_wallet_paymaster, card_wallet_address, card_spending_progress,
# card_transaction_history, card_trust_warning, txt_wallet_address,
# txt_paymaster_status, input_recipient_address, input_transfer_amount,
# input_transfer_memo, btn_send_transfer, btn_copy_address and btn_wallet_back are
# `testable*` literals in ui/screens/WalletPage.kt at v0.5.224.
# NOT asserted: wallet_loading, wallet_unsupported and text_wallet_no_transactions
# are still `proposed:` in CSD-057 §2, so the loading state, the node refusal and
# the empty history cannot be asserted at all. CSD-057 §5 carries that.
# NOT asserted: card_spending_progress, card_transaction_history and
# card_trust_warning. WalletPage.kt renders them only with spending limits
# (:265), recent transactions (:293) or degraded hardware trust (:298), and the
# defaults are null / empty / false. No fixture seeds that state, and a step
# whose only precondition is the card it asserts would assert nothing. CSD-057
# §5 disclaims them until a seeded wallet exists.
client: ">=0.5.224"

steps:
  - step_id: on_the_wallet
    title: The card leads with the experimental notice, not with a balance
    description: >-
      `card_wallet_experimental` first and by itself is the assertion CSD-057 §1
      turns on: money that may be lost must say so before it shows a number, and a
      card that rendered the balance and dropped the banner would read as a
      settled product.
    requires:
      screen: Wallet
    expect:
      visible: [card_wallet_experimental, card_wallet_balance]

  - step_id: the_paymaster_and_the_limits
    title: Who pays the fees, and the limits, are on screen
    description: >-
      txt_paymaster_status is the row that says whether a send costs the person
      anything. PaymasterStatusCard and WalletLimitsCard render whenever a wallet
      status is on screen (WalletPage.kt:250, :290), so both are asserted
      unconditionally.
    expect:
      visible: [card_wallet_paymaster, txt_paymaster_status, card_wallet_limits]

  - step_id: the_address_when_the_wallet_has_one
    title: A wallet with an address shows it, copyable
    description: >-
      WalletAddressCard renders only when the status carries an address
      (WalletPage.kt:260). Optional on that state: skipped, loudly, on a wallet
      with none.
    optional_step: true
    requires:
      visible: [card_wallet_address]
    expect:
      visible: [txt_wallet_address, btn_copy_address]

  - step_id: the_transfer_form_when_sending_is_possible
    title: A wallet that can send shows the whole form
    description: >-
      WalletTransferCard renders only for a wallet that has an address and is
      not receive-only (WalletPage.kt:270). When it is there, all three inputs
      and the send button are.
    optional_step: true
    requires:
      visible: [card_wallet_transfer]
    expect:
      visible:
        - input_recipient_address
        - input_transfer_amount
        - input_transfer_memo
        - btn_send_transfer

  - step_id: the_transfer_form_takes_input
    title: A recipient, an amount and a memo are all enterable
    description: >-
      Input only — the flow never presses btn_send_transfer. A test that moves real
      value is not a test, and CSD-057 §5 says the happy path is out of scope for
      that reason rather than for a technical one. Optional on the form being
      there, as above.
    optional_step: true
    requires:
      visible: [input_recipient_address]
    do:
      - input: {input_recipient_address: "0x0000000000000000000000000000000000000000"}
      - input: {input_transfer_amount: "0"}
      - input: {input_transfer_memo: "flow check, never sent"}
    expect:
      screen: Wallet
      visible: [btn_send_transfer]

  - step_id: back_leaves_the_card
    title: Back returns to Communities and Businesses > Rules
    description: >-
      The shell's back (`btn_nav_back`, CirclesShell) — the card opened from a
      seven-card tab, and that is the arrow a person sees. `btn_wallet_back` is
      the page's own arrow, drawn only when the page runs outside the shell
      in a wide window; on the Linux desktop leg (2026-09-29) it was not on
      screen and this step failed on it.
    do:
      - click: btn_nav_back
    expect:
      absent: [card_wallet_balance]
