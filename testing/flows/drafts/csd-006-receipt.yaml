csd: CSD-006
flow: csd_006_receipt
title: The receipt opens over a CEG item and renders all five facts
description: >-
  CSD-006 is the template every other card's receipt binds, so this flow drives
  it on the first surface that carries it (Contacts, CSD-005). The claim is that
  the sheet renders FIVE rows every time — never four, never blank — because a
  fact the node did not send is itself a fact about the node and renders as
  "This node did not send this." rather than nothing.
# Floor: sheet_receipt and the five receipt_* tags are `testable*` literals in
# ui/primitives/ReceiptSheet.kt at 0.5.225, and the hamburger is derived by
# ItemRow from the receipt id (PeopleTags.receipt, PeopleSupport.kt). The rule
# row reads the wire (Contact.grant) since PR #101; 0.5.225 is the client whose
# grant-less receipt no longer guesses the scope.
client: ">=0.5.225"
# INCOMPLETE: no step clicks a concrete `btn_receipt_<keyId>` -- `click:` takes a
# literal tag and no fixture seeds a contact with a known key id -- so every
# step gated on `sheet_receipt` skips. CSD-006 §5 says so; this flow is not
# evidence for the five facts until it opens a receipt.

steps:
  - step_id: a_row_with_a_hamburger
    title: A CEG row carries a hamburger; app chrome does not
    description: >-
      Entry precondition: a contact must exist for there to be a claim to open.
      The flow cannot know its key id, so it asserts the class of tags rather than
      one instance — which is also the honest shape, since the rule in CSD-006 §1
      is about every row, not a particular one.
    optional_step: true
    requires:
      screen: Contacts
      visible: [contacts_list]
    expect:
      count: {of: "btn_receipt_*", min: 1}

  - step_id: five_facts_every_time
    title: The sheet renders all five envelope rows
    description: >-
      Five separate tags, not one `sheet_receipt` check. A sheet that composed its
      frame and three rows answers a `visible: [sheet_receipt]` assertion
      correctly, and "all five, always" is the entire contract this template
      exists to state.
    optional_step: true
    requires:
      visible: [sheet_receipt]
    expect:
      visible:
        - sheet_receipt
        - receipt_subject
        - receipt_attester
        - receipt_scope
        - receipt_dimension
        - receipt_rule

  - step_id: the_dimension_is_the_bound_wire_string
    title: The dimension row carries the wire dimension, not a friendly label
    description: >-
      `consent:replication:v1` for a contact. The plain label sits ABOVE the mono
      string; the row asserted here is the protocol value, which is what makes the
      receipt auditable rather than decorative.
    optional_step: true
    requires:
      visible: [sheet_receipt]
    expect:
      matches: {receipt_dimension: "consent:replication"}

  - step_id: the_rule_row_is_off_the_wire
    title: The rule row carries the grant's consent prefixes, read off the wire
    description: >-
      CIRISServer#616 closed and 0.5.217 sends all five facts on GET /v1/contacts
      (`grant`, built by peer.rs::grant_receipt); Contact.kt decodes it and
      PeopleSupport.contactReceipt renders every fact from it, so the rule row
      is the grant's consent_prefixes — "chat:" for any contact who can be
      messaged. This step used to assert "did not send" while the client still
      composed the row from rules; it flipped in the same commit that read the
      field, which is the point of asserting it at all.
    optional_step: true
    requires:
      visible: [sheet_receipt]
    expect:
      matches: {receipt_rule: "chat:"}

  - step_id: a_grant_less_row_says_not_sent_never_a_guess
    title: On a node that sends no grant, the attester, scope and rule say the node did not send them
    description: >-
      A node older than 0.5.217, or a `grant: null` row. The dimension stays
      by rule (a contact IS a consent:replication:v1 grant, CC 3.3.7); the
      attester (consent is by the person since 0.5.211) and the scope (the
      consent audience the person chose, peer.rs::add_contact) are facts the
      node did not send, and the sheet says so instead of "this node" or
      "Everyone". Pinned at unit level (PeopleSupportTest) and asserted here
      only against an old node.
    optional_step: true
    requires:
      visible: [sheet_receipt]
      text: {receipt_rule: "did not send"}
    expect:
      text: {receipt_attester: "did not send", receipt_scope: "did not send"}
      matches: {receipt_dimension: "consent:replication"}
