csd: CSD-101
flow: csd_101_household_members
title: The household's roster, on Family › People
description: >-
  CSD-101 §4, driven. Family › People holds Contacts and the household roster;
  the roster is reached as its own row. A member is added from your contacts
  only, because the node admits only a registered identity
  (family.unknown_member_key, CIRISServer src/family_api.rs:925-947).
# Floor: every tag below is a string literal in ui/screens/HouseholdsSupport.kt
# (HouseholdTags); all literals at 0.5.225.
# NOT asserted: adding a real member. It needs a second identity registered on
# the node, which the fixture does not stand up.
client: ">=0.5.225"
steps:
  - step_id: on_the_roster
    title: The roster composes in one of its states, never a blank
    description: >-
      Entry: circle_family -> tab_people -> nav_epistemic_household_members
      (derived by nav_map). The matrix's node has no household, so this step
      accepts the empty shape; the populated one below is gated on the list.
    requires:
      screen: HouseholdMembers
    expect:
      count: {of: "household_members_*", min: 1}
      absent: [household_members_error]

  - step_id: the_roster_names_who_is_in_the_household
    title: With a household, the roster names who is in it
    description: >-
      Needs a household (CSD-100's flow forms one; the bare node has none). A
      household always holds at least its founder, so min 1.
    optional_step: true
    requires:
      screen: HouseholdMembers
      visible: [household_members_list]
    expect:
      state: populated
      visible: [households_switcher, household_members_list, household_limits]
      count: {of: "household_member_*", min: 1}

  - step_id: no_household_says_where_to_form_one
    title: With no household, the roster points to the hub
    optional_step: true
    requires:
      screen: HouseholdMembers
      visible: [household_members_no_household]
    expect:
      state: empty
      visible: [household_members_no_household, btn_household_members_go_rules]

  - step_id: add_picks_from_contacts
    title: Adding someone offers your contacts, or says there are none
    optional_step: true
    requires:
      visible: [btn_household_member_add_open]
    do:
      - click: btn_household_member_add_open
    expect:
      visible: [card_household_member_add]
